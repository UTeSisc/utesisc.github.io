      const cleanSesiName = (sStr) => {

      const mapPPDStandard = (rawPpd) => {
         const str = safeStr(rawPpd).toUpperCase();
         if (!str) return 'TIADA PPD';
         if (str.includes('RAMAKRISHNA') || str.includes('TIMUR LAUT')) return 'PPD TIMUR LAUT';
         if (str.includes('TELOI KANAN') || str.includes('BALING')) return 'PPD BALING';
         if (str.includes('TASEK GELUGOR') || str.includes('SEBERANG PERAI UTARA')) return 'PPD SEBERANG PERAI UTARA';
         if (str.includes('SEBERANG PERAI SELATAN')) return 'PPD SEBERANG PERAI SELATAN';
         if (str.includes('SEBERANG PERAI TENGAH')) return 'PPD SEBERANG PERAI TENGAH';
         if (str.includes('BARAT DAYA')) return 'PPD BARAT DAYA';
         if (str.includes('KINTA UTARA')) return 'PPD KINTA UTARA';
         if (str.includes('KINTA SELATAN')) return 'PPD KINTA SELATAN';
         if (str.includes('KUALA KANGSAR')) return 'PPD KUALA KANGSAR';
         if (str.includes('KOTA SETAR')) return 'PPD KOTA SETAR';
         if (str.includes('KULIM') || str.includes('BANDAR BAHARU')) return 'PPD KULIM/BANDAR BAHARU';
         if (str.includes('KUALA MUDA') || str.includes('YAN')) return 'PPD KUALA MUDA';
         if (str.includes('PENDANG')) return 'PPD PENDANG';
         if (str.includes('KUBANG PASU')) return 'PPD KUBANG PASU';
         if (str.includes('LARUT') || str.includes('MATANG') || str.includes('SELAMA')) return 'PPD LARUT MATANG SELAMA';
         if (str.includes('KERIAN')) return 'PPD KERIAN';
         if (str.includes('PADANG TERAP')) return 'PPD PADANG TERAP';
         if (str.includes('HILIR PERAK')) return 'PPD HILIR PERAK';
         if (str.includes('MUALLIM')) return 'PPD MUALLIM';
         if (str.includes('PERLIS') || str.includes('JPN PERLIS')) return 'JPN PERLIS';
         return str.startsWith('PPD ') ? str : `PPD ${str}`;
      };

      const detectJantinaFromKP = (noKp) => {
         const cleanKp = safeStr(noKp).replace(/[^0-9]/g, '');
         if (!cleanKp) return 'LELAKI';
         const lastDigit = parseInt(cleanKp.slice(-1), 10);
         return (lastDigit % 2 === 0) ? 'PEREMPUAN' : 'LELAKI';
      };

      function RadarChartPenilaian({ skor }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);

        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartRef.current) chartRef.current.destroy();

          const dataScores = [
            Number(skor.skor_bimbingan || 0),
            Number(skor.skor_instruksional || 0),
            Number(skor.skor_pemikiran_strategik || 0),
            Number(skor.skor_analisis_data || 0),
            Number(skor.skor_interpersonal || 0),
            Number(skor.skor_evidens || 0)
          ];

          chartRef.current = new Chart(ctx, {
            type: 'radar',
            data: {
              labels: [
                'BIMBINGAN (25%)', 
                'INSTRUKSIONAL (20%)', 
                'STRATEGIK (20%)', 
                'ANALISIS DATA (15%)', 
                'INTERPERSONAL (10%)', 
                'EVIDENS (10%)'
              ],
              datasets: [{
                label: 'Skor Penguasaan (Skala 5)',
                data: dataScores,
                backgroundColor: 'rgba(212, 175, 55, 0.25)',
                borderColor: '#D4AF37',
                borderWidth: 2.5,
                pointBackgroundColor: '#F59E0B',
                pointRadius: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                r: {
                  angleLines: { color: '#334155' },
                  grid: { color: '#1e293b' },
                  ticks: { display: false },
                  pointLabels: { 
                    font: { size: 10, weight: 'bold' }, 
                    color: '#cbd5e1' 
                  },
                  suggestedMin: 0,
                  suggestedMax: 5
                }
              },
              plugins: { legend: { display: false } }
            }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [skor]);

        return <div className="w-full h-64"><canvas ref={canvasRef}></canvas></div>;
      }

      // CARTA VISUAL A4 TERBAIKI DENGAN RENDER DELAY AKURAT
      function PrintVisualCharts({ ppdData, jantinaData }) {
        const doughnutRef = useRef(null);
        const barRef = useRef(null);

        useEffect(() => {
          let doughnutChart = null;
          let barChart = null;

          const timer = setTimeout(() => {
            if (doughnutRef.current) {
              const ctx1 = doughnutRef.current.getContext('2d');
              doughnutChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                  labels: ['Lelaki', 'Perempuan'],
                  datasets: [{
                    data: [jantinaData.lelaki || 0, jantinaData.perempuan || 0],
                    backgroundColor: ['#2563EB', '#EC4899'],
                    borderWidth: 1
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { position: 'bottom', labels: { font: { size: 10, weight: 'bold' } } } }
                }
              });
            }

            if (barRef.current) {
              const ctx2 = barRef.current.getContext('2d');
              const ppdNames = Object.keys(ppdData);
              const ppdTotals = ppdNames.map(k => ppdData[k].total);

              barChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                  labels: ppdNames.length > 0 ? ppdNames : ['Tiada Data'],
                  datasets: [{
                    label: 'Jumlah Calon Dinilai',
                    data: ppdTotals.length > 0 ? ppdTotals : [0],
                    backgroundColor: '#0D9488',
                    borderRadius: 4
                  }]
                },
                options: {
                  indexAxis: 'y',
                  responsive: true,
                  maintainAspectRatio: false,
                  scales: {
                    x: { ticks: { precision: 0, font: { size: 9 } } },
                    y: { ticks: { font: { size: 9, weight: 'bold' } } }
                  },
                  plugins: { legend: { display: false } }
                }
              });
            }
          }, 100);

          return () => {
            clearTimeout(timer);
            if (doughnutChart) doughnutChart.destroy();
            if (barChart) barChart.destroy();
          };
        }, [ppdData, jantinaData]);

        return (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 my-6 border p-4 rounded-xl bg-slate-50 border-slate-200">
             <div className="h-56 flex flex-col items-center">
                <p className="text-xs font-bold text-slate-700 uppercase mb-2">Demografi Jantina Calon</p>
                <div className="w-full h-44"><canvas ref={doughnutRef}></canvas></div>
             </div>
             <div className="h-56 flex flex-col items-center">
                <p className="text-xs font-bold text-slate-700 uppercase mb-2">Taburan Calon Mengikut PPD (Bar Melintang)</p>
                <div className="w-full h-44"><canvas ref={barRef}></canvas></div>
             </div>
          </div>
        );
      }

        const [msg, setMsg] = useState({ type: '', text: '' });
        const [allResults, setAllResults] = useState([]);
        
        const [filterZonPantau, setFilterZonPantau] = useState('SEMUA');
        const [minScorePantau, setMinScorePantau] = useState(50);
        const [viewModePantau, setViewModePantau] = useState('monitor');

        const [editableZonText, setEditableZonText] = useState('');
        const [isSavingRumusan, setIsSavingRumusan] = useState(false);

        const handleLogin = async (e) => {
          e.preventDefault();
          setMsg({ type: '', text: '' });

          const { data: panelData, error } = await sb
            .from('panel_penemuduga')
            .select('*')
            .eq('no_kp', icInput.trim())
            .single();

          if (error || !panelData) {
            setMsg({ type: 'error', text: 'No. Kad Pengenalan tidak dijumpai dalam pangkalan data.' });

          }

          if (panelData.katalaluan && panelData.katalaluan !== passInput.trim()) {
            setMsg({ type: 'error', text: 'Kata laluan tidak tepat. Sila cuba lagi.' });
            return;
          }

          setCurrentPanel(panelData);
          setIsLoggedIn(true);
          fetchPenugasanAndData(panelData.no_kp);
        };

        const fetchPenugasanAndData = async (no_kp) => {
          const { data: tugasData } = await sb
            .from('penugasan_panel')
            .select('*')
            .eq('no_kp_panel', no_kp);
          if (tugasData) setPenugasanList(tugasData);

          const { data: cData } = await sb.from('calon').select('*').order('nama_penuh', { ascending: true });
          if (cData) setCalonList(cData);

          const { data: pData } = await sb.from('panel_penemuduga').select('*');
          if (pData) setPanelList(pData);

          const { data: rData } = await sb.from('penilaian_skor').select('*');
          if (rData) setAllResults(rData);
        };

        const calonBilik = selectedTugas ? calonList.filter(c => {
          const zonCalon = safeStr(c.zon_temuduga).toUpperCase();
          const zonTugas = safeStr(selectedTugas.zon_bertugas).toUpperCase();
          const zonSama = zonCalon === zonTugas || zonTugas === 'SEMUA ZON';

          if (!zonSama) return false;

          const sesiCalonClean = cleanSesiName(c.sesi);
          const sesiFilterClean = cleanSesiName(filterSesiTapis);

          if (filterSesiTapis === 'SEMUA') {
            const sesiTugasClean = cleanSesiName(selectedTugas.sesi_bertugas);
            if (safeStr(selectedTugas.sesi_bertugas).toUpperCase().includes("SEMUA SESI")) return true;
            return sesiCalonClean === sesiTugasClean;
          }

          return sesiCalonClean === sesiFilterClean;
        }) : [];

        const validResults = allResults.filter(r => calonList.some(c => safeStr(c.no_kp) === safeStr(r.no_kp_calon)));

        const consolidatedLiveList = calonList.map(calon => {
           const calonResList = validResults.filter(r => safeStr(r.no_kp_calon) === safeStr(calon.no_kp));
           if (calonResList.length === 0) return null;

           let sums = { bimb:0, inst:0, strat:0, data:0, inter:0, evi:0 };
           let counts = { bimb:0, inst:0, strat:0, data:0, inter:0, evi:0 };
           
           let panelMap = {}; 
           let ulasanArr = [];

           calonResList.forEach(r => {
              let compList = [];
              if (Number(r.skor_bimbingan) > 0) { sums.bimb += Number(r.skor_bimbingan); counts.bimb++; compList.push("Bimbingan"); }
              if (Number(r.skor_instruksional) > 0) { sums.inst += Number(r.skor_instruksional); counts.inst++; compList.push("Instruksional"); }
              if (Number(r.skor_pemikiran_strategik) > 0) { sums.strat += Number(r.skor_pemikiran_strategik); counts.strat++; compList.push("Strategik"); }
              if (Number(r.skor_analisis_data) > 0) { sums.data += Number(r.skor_analisis_data); counts.data++; compList.push("Analisis"); }
              if (Number(r.skor_interpersonal) > 0) { sums.inter += Number(r.skor_interpersonal); counts.inter++; compList.push("Interpersonal"); }
              if (Number(r.skor_evidens) > 0) { sums.evi += Number(r.skor_evidens); counts.evi++; compList.push("Evidens"); }

              const pName = safeStr(r.nama_panel).toUpperCase();
              if (pName) {
                 if (!panelMap[pName]) panelMap[pName] = new Set();
                 compList.forEach(cItem => panelMap[pName].add(cItem));

              if (r.ulasan_panel && r.ulasan_panel.trim() !== "") {
                 const textUlasan = `${pName}: ${r.ulasan_panel.trim()}`;
                 if (!ulasanArr.includes(textUlasan)) ulasanArr.push(textUlasan);
              }
           });

           let panelInfoArr = Object.keys(panelMap).map(pName => {
              const compArr = Array.from(panelMap[pName]);
              return {
                 nama: pName,
                 elemen: compArr.length > 0 ? compArr.join(", ") : "Semua Elemen"
              };
           });

           const avgBimb = counts.bimb > 0 ? (sums.bimb / counts.bimb) : 0;
           const avgInst = counts.inst > 0 ? (sums.inst / counts.inst) : 0;
           const avgStrat = counts.strat > 0 ? (sums.strat / counts.strat) : 0;
           const avgData = counts.data > 0 ? (sums.data / counts.data) : 0;
           const avgInter = counts.inter > 0 ? (sums.inter / counts.inter) : 0;
           const avgEvi = counts.evi > 0 ? (sums.evi / counts.evi) : 0;

           const totalMuktamad = Number((
              (avgBimb / 5) * 25 +
              (avgInst / 5) * 20 +
              (avgStrat / 5) * 20 +
              (avgData / 5) * 15 +
              (avgInter / 5) * 10 +
              (avgEvi / 5) * 10

        const calcJumlahMarkah = () => {

          if (sInter > 0 && sInter <= 2) peningkatanArr.push("penyampaian hujah secara tersusun serta kawalan emosi yang konsisten");

        const handleSavePenilaian = async (e) => {

          filteredReportListPantau.forEach((res, index) => {

             const jantina = safeStr(res.jantina);
             const no_kp = safeStr(res.no_kp_calon);
             const subjek = safeStr(res.sme_subjek).replace(/"/g, '""');
             const ppd = safeStr(res.ppd).replace(/"/g, '""');

             const row = [index + 1, `"${nama}"`, `"${jantina}"`, `="${no_kp}"`, `"${subjek}"`, `"${ppd}"`, `"${zon}"`, res.totalMarkah];
             csvContent += row.join(",") + "\n";

          const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });

           penugasanList.forEach(t => {

                                           <th className="p-3 border-r border-slate-400">SUBJEK</th>
                                           <th className="p-3 border-r border-slate-400">PPD</th>
                                           <th className="p-3 border-r border-slate-400">ZON</th>
                                           <th className="p-3 text-center w-28">MARKAH MUKTAMAD</th>
                                        </tr>
                                     </thead>
                                     <tbody>
                                        {filteredReportListPantau.map((res, idx) => (
                                           <tr key={idx} className="border-b border-slate-400 hover:bg-slate-50">
                                              <td className="p-2 border-r border-slate-400 text-center font-bold">{idx + 1}</td>
                                              <td className="p-2 border-r border-slate-400 font-bold uppercase">{safeStr(res.nama_calon)}</td>
                                              <td className="p-2 border-r border-slate-400 text-center font-bold">{safeStr(res.jantina)}</td>
                                              <td className="p-2 border-r border-slate-400 text-center font-mono text-xs">{safeStr(res.no_kp_calon)}</td>
                                              <td className="p-2 border-r border-slate-400 text-center uppercase">{res.sme_subjek || '-'}</td>
                                              <td className="p-2 border-r border-slate-400 text-center uppercase">{res.ppd || '-'}</td>
                                              <td className="p-2 border-r border-slate-400 text-center uppercase">{safeStr(res.zon)}</td>
                                              <td className="p-2 text-center font-extrabold text-base text-blue-900">{res.totalMarkah}%</td>
                                           </tr>
                                        ))}
                                        {filteredReportListPantau.length === 0 && (
                                           <tr><td colSpan="8" className="p-8 text-center italic text-slate-500 font-semibold">Tiada calon di kawasan pilihan yang melepasi had markah {minScorePantau}% yang ditetapkan.</td></tr>
                                        )}
                                     </tbody>
                                  </table>
                                  
                                  <div className="mt-8 text-xs text-slate-500 italic border-t border-slate-300 pt-3 text-center">
                                     * Markah janaan ini merupakan purata terkumpul daripada kesemua panel penemuduga yang menilai calon setakat {new Date().toLocaleDateString('en-GB')}.
                                  </div>
                               </div>
                            </div>
                         )}

                         {/* MOD 3: JANAAN LAPORAN ANALISIS EKSEKUTIF (TEKS BOLEH EDIT & SIMPAN KE SUPABASE) */}
                         {viewModePantau === 'summary' && (
                            <div className="space-y-6">
                               <div className="bg-slate-950 p-6 rounded-2xl border border-purple-500/40 shadow-xl space-y-4">
                                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-3">
                                     <div>
                                        <h3 className="text-base font-extrabold text-purple-400 flex items-center gap-2">
                                           ⚡ Janaan Laporan Analisis Eksekutif ({zonAktifPantau})
                                        </h3>
                                        <p className="text-xs text-slate-400 mt-0.5">Sila sunting teks laporan di bawah jika ada ulasan tambahan, kemudian tekan 'Simpan Rumusan Zon'.</p>
                                     </div>
                                     <div className="flex gap-2">
                                        <button onClick={handleSaveRumusanToDB} disabled={isSavingRumusan} className="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black px-4 py-2 rounded-lg text-xs shadow transition-transform active:scale-95 disabled:opacity-50">
                                           {isSavingRumusan ? '💾 Menyimpan...' : '💾 Simpan Rumusan Zon'}
                                        </button>
                                        <button onClick={() => { navigator.clipboard.writeText(editableZonText); alert('Teks laporan analisis berjaya disalin!'); }} className="bg-purple-600 hover:bg-purple-700 text-white font-extrabold px-4 py-2 rounded-lg text-xs shadow transition-transform active:scale-95">
                                           📋 Salin Teks
                                        </button>
                                     </div>
                                  </div>

                                  <textarea rows="24" className="w-full p-4 bg-slate-900 border border-slate-800 rounded-xl text-xs font-mono leading-relaxed text-slate-100 focus:border-purple-500 focus:outline-none" value={editableZonText} onChange={e => setEditableZonText(e.target.value)}></textarea>
                               </div>
                            </div>
                         )}

                         {/* MOD 4: PAPARAN CETAKAN VISUAL A4 EKSKLUSIF (CARTA CINCIN + CARTA BAR MELINTANG + TEXT + PANEL LIST) */}
                         {viewModePantau === 'print_visual' && (
                            <div className="space-y-6">
                               <div className="flex justify-between items-center bg-slate-950 p-4 rounded-xl border border-blue-500/30 no-print">
                                  <div>
                                     <h3 className="text-sm font-extrabold text-blue-400">Paparan Cetakan Dokumen Rasmi A4 (Visual & Naratif)</h3>
                                     <p className="text-xs text-slate-400 mt-0.5">Laporan visual siap cetak lengkap dengan Logo KPM, Carta Visual, dan Teks Rasmi yang disimpan.</p>
                                  </div>
                                  <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-700 text-white font-black px-6 py-2.5 rounded-lg text-xs shadow-lg transition-transform active:scale-95">
                                     🖨️ Cetak Dokumen A4
                                  </button>
                               </div>

                               <div className="bg-white p-10 border rounded-xl print-area text-slate-900 shadow-2xl space-y-6">
                                  {/* KEPALA SURAT */}
                                  <div className="text-center border-b-2 border-slate-900 pb-4">
                                     <img src="logo-kpm.png" alt="Logo KPM" className="h-20 mx-auto mb-2 object-contain" />
                                     <h3 className="text-sm font-bold uppercase tracking-wider">Kementerian Pendidikan Malaysia</h3>
                                     <h4 className="text-xs font-semibold text-slate-600 uppercase">Bahagian Profesionalisme Guru</h4>
                                     <h2 className="text-base font-black uppercase mt-3 tracking-wide text-blue-950">
                                        LAPORAN ANALISIS STRATEGIK PENILAIAN KOMPETENSI PEMILIHAN PEGAWAI SISC+ ({zonAktifPantau})
                                     </h2>
                                     <p className="text-xs text-slate-600 font-semibold mt-1">Tarikh Janaan: {new Date().toLocaleDateString('en-GB')}</p>
                                  </div>

                                  {/* VISUAL CARTA DINAMIK A4 */}
                                  <PrintVisualCharts ppdData={ppdMapForChart} jantinaData={jantinaDataForChart} />

                                  {/* TEKS RUMUSAN YANG DISUNTING & DISIMPAN */}
                                  <div className="bg-slate-50 p-4 rounded-lg border border-slate-300 whitespace-pre-line text-xs font-mono leading-relaxed text-slate-800">
                                     {editableZonText || generateZonSummaryText()}
                                  </div>

                                  {/* RUANGAN TANDATANGAN */}
                                  <div className="mt-12 flex justify-between items-end text-xs text-slate-800 pt-8 border-t border-slate-300">
                                     <div>
                                        <p className="font-bold text-slate-500 uppercase text-[10px] mb-1">Disediakan Oleh:</p>
                                        <p className="font-bold uppercase text-sm">{safeStr(currentPanel?.nama_penuh).toUpperCase()}</p>
                                        <p className="uppercase text-[11px] text-slate-600">KETUA ZON PANEL PENEMUDUGA ({zonAktifPantau})</p>
                                     </div>
                                     <div className="text-right">
                                        <p className="font-bold text-slate-500 uppercase text-[10px] mb-1">Disahkan Oleh:</p>
                                        <p className="font-bold uppercase text-sm">URUS SETIA PEMILIHAN SISC+</p>
                                        <p className="uppercase text-[11px] text-slate-600">BAHAGIAN PROFESIONALISME GURU</p>
                                        <p className="mt-1 text-[10px] font-semibold text-slate-500">Tarikh Pengesahan: {new Date().toLocaleDateString('en-GB')}</p>
                                     </div>
                                  </div>
                               </div>
                            </div>
                         )}

                      </div>
                   )}

                </div>
              )}

            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<PanelApp />);
    </script>
  </body>
</html>
