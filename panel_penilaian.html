<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Panel Penemuduga - Sistem SISC+</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; color: black !important; font-family: 'Arial', sans-serif; }
        .print-area { border: none !important; box-shadow: none !important; padding: 0 !important; width: 100% !important; margin: 0 !important; }
        @page { size: A4 portrait; margin: 10mm; }
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const SUPABASE_URL = 'https://beyxrxnuuwegkvziglmg.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_Ei-t0rPawbj3j8EpOOdAvQ_lwPz-oKO';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const safeStr = (val) => (val ? String(val).trim() : '');
      const cleanKpNum = (val) => safeStr(val).replace(/[^0-9]/g, '');

      // CARTA RADAR KOMPETENSI
      function RadarIndividuChart({ scores }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);

        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartRef.current) chartRef.current.destroy();

          chartRef.current = new Chart(ctx, {
            type: 'radar',
            data: {
              labels: [
                'BIMBINGAN (25%)',
                'INSTRUKSIONAL (20%)',
                'STRATEGIK (20%)',
                'ANALISIS DATA (15%)',
                'INTERPERSONAL (10%)',
                'EVIDENS (10%)'
              ],
              datasets: [{
                label: 'Skor Penguasaan',
                data: [
                  scores.bimbingan || 0,
                  scores.instruksional || 0,
                  scores.strategik || 0,
                  scores.data || 0,
                  scores.interpersonal || 0,
                  scores.evidens || 0
                ],
                backgroundColor: 'rgba(245, 158, 11, 0.25)',
                borderColor: '#F59E0B',
                borderWidth: 2.5,
                pointBackgroundColor: '#F59E0B'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                r: {
                  angleLines: { color: '#334155' },
                  grid: { color: '#1e293b' },
                  ticks: { display: false },
                  pointLabels: { font: { size: 9, weight: 'bold' }, color: '#cbd5e1' },
                  suggestedMin: 0,
                  suggestedMax: 5
                }
              },
              plugins: { legend: { display: false } }
            }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [scores]);

        return <div className="w-full h-56"><canvas ref={canvasRef}></canvas></div>;
      }

      function PanelApp() {
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [panelKpInput, setPanelKpInput] = useState('');
        const [panelPassInput, setPanelPassInput] = useState('');
        const [currentPanel, setCurrentPanel] = useState(null);
        const [currentAssignment, setCurrentAssignment] = useState(null);
        const [assignmentList, setAssignmentList] = useState([]);

        const [calonList, setCalonList] = useState([]);
        const [evaluatedList, setEvaluatedList] = useState([]);
        const [selectedCalon, setSelectedCalon] = useState(null);

        const [filterSesi, setFilterSesi] = useState('SEMUA');
        const [searchCalon, setSearchCalon] = useState('');
        const [msg, setMsg] = useState({ type: '', text: '' });
        const [saving, setSaving] = useState(false);

        // BORANG SKOR PENILAIAN (SKALA 1 - 5)
        const [skorForm, setSkorForm] = useState({
          bimbingan: 0,
          instruksional: 0,
          strategik: 0,
          data: 0,
          interpersonal: 0,
          evidens: 0,
          ulasan: ''
        });

        // LOG MASUK PANEL
        const handleLogin = async (e) => {
          e.preventDefault();
          setMsg({ type: '', text: '' });

          const cleanKp = cleanKpNum(panelKpInput);
          const pass = safeStr(panelPassInput);

          try {
            const { data: pData, error: pErr } = await sb
              .from('panel_penemuduga')
              .select('*');

            if (pErr) throw pErr;

            const foundPanel = pData.find(p => cleanKpNum(p.no_kp) === cleanKp && safeStr(p.katalaluan) === pass);

            if (!foundPanel) {
              setMsg({ type: 'error', text: 'No. KP atau Kata Laluan tidak sah.' });
              return;
            }

            // AMBIL REKOD PENUGASAN PANEL
            const { data: tData, error: tErr } = await sb
              .from('penugasan_panel')
              .select('*')
              .eq('no_kp_panel', foundPanel.no_kp);

            if (tErr) throw tErr;

            if (!tData || tData.length === 0) {
              setMsg({ type: 'error', text: 'Profil panel dijumpai tetapi belum menerima agihan penugasan zon/pusat daripada Admin.' });
              return;
            }

            setCurrentPanel(foundPanel);
            setAssignmentList(tData);
            setCurrentAssignment(tData[0]); // Pilih penugasan pertama secara default
            setIsLoggedIn(true);

          } catch (err) {
            setMsg({ type: 'error', text: 'Ralat: ' + err.message });
          }
        };

        // MUAT TURUN SENARAI CALON & PENILAIAN
        const fetchCalonData = async () => {
          if (!currentAssignment || !currentPanel) return;

          try {
            const { data: cData } = await sb.from('calon').select('*').order('nama_penuh', { ascending: true });
            const { data: rData } = await sb.from('penilaian_skor').select('*').eq('no_kp_panel', currentPanel.no_kp);

            if (cData) setCalonList(cData);
            if (rData) setEvaluatedList(rData);
          } catch (err) {
            console.error('Ralat memuat data calon:', err);
          }
        };

        useEffect(() => {
          if (isLoggedIn && currentAssignment) {
            fetchCalonData();
          }
        }, [isLoggedIn, currentAssignment]);

        // LOGIK PADANAN PINTAR ZON & PUSAT
        const filteredCalonByCenter = calonList.filter(c => {
          if (!currentAssignment) return false;

          const panelZon = safeStr(currentAssignment.zon_bertugas).toUpperCase();
          const panelPusat = safeStr(currentAssignment.pusat_bertugas).toUpperCase();

          const calonZon = safeStr(c.zon_temuduga).toUpperCase();
          const calonPusat = safeStr(c.pusat_temuduga).toUpperCase();

          // 1. Padanan Zon
          const matchZon = calonZon === panelZon || calonZon.includes(panelZon) || panelZon === 'SEMUA ZON';
          if (!matchZon) return false;

          // 2. Padanan Pusat: Jika Panel ditugaskan di pusat spesifik (cth: KUCHING atau MIRI)
          if (panelPusat && panelPusat !== '' && panelPusat !== 'UTAMA' && panelPusat !== '-') {
            const matchPusatExact = calonPusat === panelPusat;
            const matchPusatInZonString = calonZon.includes(panelPusat); // Kes calon masih format lama 'SARAWAK (KUCHING)'
            return matchPusatExact || matchPusatInZonString;
          }

          // 3. Jika sesi lepas / tiada pusat (untick), paparkan semua calon zon tersebut
          return true;
        });

        // TAPISAN CARIAN & SESI
        const displayedCalon = filteredCalonByCenter.filter(c => {
          const matchSearch = safeStr(c.nama_penuh).toUpperCase().includes(searchCalon.toUpperCase()) || safeStr(c.no_kp).includes(searchCalon);
          const matchSesi = filterSesi === 'SEMUA' || cleanSesiName(c.sesi) === cleanSesiName(filterSesi);
          return matchSearch && matchSesi;
        });

        // PILIH CALON UNTUK DINILAI
        const handleSelectCalon = (calon) => {
          setSelectedCalon(calon);
          setMsg({ type: '', text: '' });

          const existingEval = evaluatedList.find(r => safeStr(r.no_kp_calon) === safeStr(calon.no_kp));
          if (existingEval) {
            setSkorForm({
              bimbingan: Number(existingEval.skor_bimbingan) || 0,
              instruksional: Number(existingEval.skor_instruksional) || 0,
              strategik: Number(existingEval.skor_pemikiran_strategik) || 0,
              data: Number(existingEval.skor_analisis_data) || 0,
              interpersonal: Number(existingEval.skor_interpersonal) || 0,
              evidens: Number(existingEval.skor_evidens) || 0,
              ulasan: existingEval.ulasan_panel || ''
            });
          } else {
            setSkorForm({
              bimbingan: 0,
              instruksional: 0,
              strategik: 0,
              data: 0,
              interpersonal: 0,
              evidens: 0,
              ulasan: ''
            });
          }
        };

        // KIRAAN MARKAH BERWAJARAN
        const m1 = (skorForm.bimbingan / 5) * 25;
        const m2 = (skorForm.instruksional / 5) * 20;
        const m3 = (skorForm.strategik / 5) * 20;
        const m4 = (skorForm.data / 5) * 15;
        const m5 = (skorForm.interpersonal / 5) * 10;
        const m6 = (skorForm.evidens / 5) * 10;
        const jumlahMarkah = Number((m1 + m2 + m3 + m4 + m5 + m6).toFixed(1));

        // SIMPAN PENILAIAN
        const handleSavePenilaian = async (e) => {
          e.preventDefault();
          if (!selectedCalon) return alert("Sila pilih calon terlebih dahulu.");
          if (skorForm.bimbingan === 0 || skorForm.instruksional === 0 || skorForm.strategik === 0 || skorForm.data === 0 || skorForm.interpersonal === 0 || skorForm.evidens === 0) {
            return alert("Sila berikan markah (1 - 5) untuk kesemua 6 domain kompetensi.");
          }

          setSaving(true);
          setMsg({ type: '', text: '' });

          const payload = {
            no_kp_calon: selectedCalon.no_kp,
            nama_calon: safeStr(selectedCalon.nama_penuh).toUpperCase(),
            no_kp_panel: currentPanel.no_kp,
            nama_panel: safeStr(currentPanel.nama_penuh).toUpperCase(),
            skor_bimbingan: skorForm.bimbingan,
            skor_instruksional: skorForm.instruksional,
            skor_pemikiran_strategik: skorForm.strategik,
            skor_analisis_data: skorForm.data,
            skor_interpersonal: skorForm.interpersonal,
            skor_evidens: skorForm.evidens,
            jumlah_skor: jumlahMarkah,
            status_lulus: jumlahMarkah >= 75,
            ulasan_panel: safeStr(skorForm.ulasan)
          };

          try {
            // Semak rekod sedia ada bagi panel ini
            const existing = evaluatedList.find(r => safeStr(r.no_kp_calon) === safeStr(selectedCalon.no_kp));

            let resError;
            if (existing) {
              const { error } = await sb.from('penilaian_skor').update(payload).eq('id', existing.id);
              resError = error;
            } else {
              const { error } = await sb.from('penilaian_skor').insert([payload]);
              resError = error;
            }

            if (resError) throw resError;

            // Kemaskini kehadiran calon kepada 'HADIR' secara automatik
            await sb.from('calon').update({ kehadiran: 'HADIR' }).eq('no_kp', selectedCalon.no_kp);

            setMsg({ type: 'success', text: `Skor bagi ${selectedCalon.nama_penuh} berjaya disimpan! (${jumlahMarkah}%)` });
            fetchCalonData();
          } catch (err) {
            setMsg({ type: 'error', text: 'Gagal menyimpan: ' + err.message });
          } finally {
            setSaving(false);
          }
        };

        return (
          <div className="min-h-screen flex flex-col bg-slate-950">
            {/* HEADER ATAS */}
            <div className="bg-white w-full py-4 px-6 md:px-10 flex justify-between items-center shadow-md border-b-4 border-amber-500 no-print">
              <div className="flex items-center gap-4">
                <img src="logo-kpm.png" alt="Logo KPM" className="h-12 object-contain" />
                <div>
                  <span className="font-extrabold text-lg text-slate-900 tracking-wider block leading-tight">SISTEM TEMU DUGA SISC+</span>
                  <span className="text-xs text-amber-600 font-bold uppercase tracking-widest">Portal Pegawai Panel Penemuduga</span>
                </div>
              </div>

              {isLoggedIn ? (
                <div className="flex items-center gap-3">
                  <div className="text-right hidden md:block">
                    <p className="text-xs font-black text-slate-800 uppercase">{safeStr(currentPanel?.nama_penuh)}</p>
                    <p className="text-[10px] font-bold text-amber-700 uppercase">
                      {currentAssignment?.zon_bertugas} {currentAssignment?.pusat_bertugas ? `(PUSAT: ${currentAssignment.pusat_bertugas})` : ''}
                    </p>
                  </div>
                  <button onClick={() => { setIsLoggedIn(false); setCurrentPanel(null); }} className="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-bold rounded-lg text-xs transition-colors border border-red-200">
                    Log Keluar
                  </button>
                </div>
              ) : (
                <button onClick={() => window.location.href = 'index.html'} className="px-4 py-2 bg-amber-50 text-amber-700 hover:bg-amber-100 font-bold rounded-lg text-xs transition-colors border border-amber-300">
                  Menu Utama
                </button>
              )}
            </div>

            {/* SKRIN 1: LOG MASUK PANEL */}
            {!isLoggedIn ? (
              <div className="flex-grow flex items-center justify-center p-6">
                <div className="max-w-md w-full bg-slate-900 border-2 border-amber-500/40 p-8 rounded-3xl shadow-2xl space-y-6">
                  <div className="text-center space-y-3">
                    <div className="inline-block p-3 rounded-2xl border border-amber-500/30 bg-slate-950 shadow-inner">
                      <img src="logo-kpm.png" alt="Logo KPM" className="h-14 mx-auto object-contain" />
                    </div>
                    <div>
                      <span className="px-3 py-0.5 bg-amber-500/20 text-amber-300 font-extrabold text-[10px] rounded-full border border-amber-500/40 uppercase tracking-widest">
                        AKSES PENILAI RASMI
                      </span>
                      <h2 className="text-2xl font-black text-amber-400 uppercase tracking-wide mt-2">Log Masuk Panel</h2>
                      <p className="text-slate-400 text-xs mt-0.5">Sila masukkan No. KP dan Kata Laluan yang didaftarkan.</p>
                    </div>
                  </div>

                  {msg.text && (
                    <div className={`p-3 rounded-xl text-xs font-bold text-center border ${msg.type === 'error' ? 'bg-red-900/80 text-red-200 border-red-500' : 'bg-emerald-900/80 text-emerald-200 border-emerald-500'}`}>
                      {msg.text}
                    </div>
                  )}

                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-400 uppercase mb-1">No. Kad Pengenalan (Panel)</label>
                      <input type="text" required placeholder="Contoh: 790723125827" className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm font-mono text-slate-100 focus:border-amber-500 focus:outline-none" value={panelKpInput} onChange={e => setPanelKpInput(e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Kata Laluan</label>
                      <input type="password" required placeholder="••••••••" className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm text-slate-100 focus:border-amber-500 focus:outline-none" value={panelPassInput} onChange={e => setPanelPassInput(e.target.value)} />
                    </div>
                    <button type="submit" className="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl text-sm shadow-lg transition-transform active:scale-95 mt-2 uppercase tracking-wider">
                      Masuk Ke Portal Penilaian
                    </button>
                  </form>
                </div>
              </div>
            ) : (
              /* SKRIN 2: PORTAL PENILAIAN */
              <div className="p-6 md:p-8 max-w-7xl mx-auto w-full flex-grow space-y-6">
                
                {/* PILIHAN PENUGASAN ZON / PUSAT */}
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">LOKASI PENUGASAN AKTIF ANDA:</span>
                    <div className="flex items-center gap-2 mt-1">
                      <span className="text-lg font-black text-amber-400 uppercase">{currentAssignment?.zon_bertugas}</span>
                      {currentAssignment?.pusat_bertugas && (
                        <span className="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full font-black text-xs uppercase">
                          PUSAT: {currentAssignment.pusat_bertugas}
                        </span>
                      )}
                      <span className="text-xs text-slate-400 font-semibold">({currentAssignment?.peranan})</span>
                    </div>
                  </div>

                  {assignmentList.length > 1 && (
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-slate-400">Tukar Sesi/Pusat:</span>
                      <select 
                        className="p-2 bg-slate-950 border border-slate-700 rounded-lg text-xs font-bold text-amber-400"
                        value={currentAssignment?.id}
                        onChange={e => {
                          const matched = assignmentList.find(t => t.id === Number(e.target.value));
                          if (matched) setCurrentAssignment(matched);
                        }}
                      >
                        {assignmentList.map(t => (
                          <option key={t.id} value={t.id}>
                            {t.zon_bertugas} {t.pusat_bertugas ? `(${t.pusat_bertugas})` : ''} - {t.sesi_bertugas}
                          </option>
                        ))}
                      </select>
                    </div>
                  )}
                </div>

                {msg.text && (
                  <div className={`p-4 rounded-xl text-sm font-bold text-center border shadow-lg ${msg.type === 'error' ? 'bg-red-900/80 text-red-200 border-red-500' : 'bg-emerald-900/80 text-emerald-200 border-emerald-500'}`}>
                    {msg.text}
                  </div>
                )}

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  
                  {/* BAHAGIAN KIRI: SENARAI CALON BAGI PUSAT / ZON INI (4 KOLOM) */}
                  <div className="lg:col-span-4 bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
                    <div>
                      <h3 className="text-sm font-extrabold text-amber-400 uppercase tracking-wide">
                        Senarai Calon ({displayedCalon.length} Orang)
                      </h3>
                      <p className="text-[11px] text-slate-400 mt-0.5">
                        Calon berdaftar di {currentAssignment?.zon_bertugas} {currentAssignment?.pusat_bertugas ? `(Pusat: ${currentAssignment.pusat_bertugas})` : ''}
                      </p>
                    </div>

                    {/* TAPISAN CARIAN & SESI */}
                    <div className="space-y-2">
                      <input 
                        type="text" 
                        placeholder="🔍 Cari Calon / No. KP..." 
                        className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-100 focus:border-amber-500 focus:outline-none" 
                        value={searchCalon} 
                        onChange={e => setSearchCalon(e.target.value)} 
                      />
                      <select 
                        className="w-full p-2 bg-slate-950 border border-slate-700 rounded-lg text-xs font-bold text-slate-200"
                        value={filterSesi}
                        onChange={e => setFilterSesi(e.target.value)}
                      >
                        <option value="SEMUA">Semua Sesi</option>
                        <option value="SESI 1">SESI 1</option>
                        <option value="SESI 2">SESI 2</option>
                        <option value="SESI 3">SESI 3</option>
                        <option value="SESI 4">SESI 4</option>
                        <option value="SESI 5">SESI 5</option>
                        <option value="SESI KHAS">SESI KHAS</option>
                      </select>
                    </div>

                    {/* KAD SENARAI CALON */}
                    <div className="overflow-y-auto max-h-[550px] space-y-2 pr-1">
                      {displayedCalon.length === 0 ? (
                        <div className="p-8 text-center text-slate-500 italic text-xs border border-dashed border-slate-800 rounded-xl">
                          Tiada calon ditemui untuk zon/pusat ini.
                        </div>
                      ) : (
                        displayedCalon.map((c, idx) => {
                          const isDone = evaluatedList.some(r => safeStr(r.no_kp_calon) === safeStr(c.no_kp));
                          const isSelected = selectedCalon?.no_kp === c.no_kp;

                          return (
                            <div 
                              key={c.no_kp} 
                              onClick={() => handleSelectCalon(c)}
                              className={`p-3 rounded-xl border cursor-pointer transition-all ${isSelected ? 'bg-amber-500/10 border-amber-500 shadow-md' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`}
                            >
                              <div className="flex justify-between items-start gap-2">
                                <div>
                                  <p className="font-extrabold text-xs text-slate-100 uppercase leading-snug">{safeStr(c.nama_penuh)}</p>
                                  <p className="text-[10px] font-mono text-slate-400 mt-0.5">{c.no_kp}</p>
                                  <p className="text-[10px] text-slate-400 uppercase mt-0.5">{safeStr(c.ppd)} ({safeStr(c.sme_subjek)})</p>
                                </div>
                                <span className={`px-2 py-0.5 rounded text-[9px] font-black uppercase whitespace-nowrap ${isDone ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-slate-800 text-slate-400'}`}>
                                  {isDone ? 'SELESAI' : 'BELUM'}
                                </span>
                              </div>
                              <div className="flex justify-between items-center mt-2 pt-2 border-t border-slate-900 text-[10px]">
                                <span className="font-bold text-amber-400 uppercase">{safeStr(c.sesi)}</span>
                                <span className="font-mono text-slate-400">{c.bilik_temuduga || 'BILIK 1'}</span>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>

                  {/* BAHAGIAN KANAN: BORANG RUBRIK PENILAIAN & RADAR (8 KOLOM) */}
                  <div className="lg:col-span-8 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
                    {!selectedCalon ? (
                      <div className="flex flex-col items-center justify-center p-16 text-center border-2 border-dashed border-slate-800 rounded-2xl">
                        <span className="text-5xl text-slate-700 mb-3">📝</span>
                        <h4 className="text-base font-bold text-slate-300">Sila Pilih Calon Di Sebelah Kiri</h4>
                        <p className="text-xs text-slate-500 mt-1 max-w-sm">
                          Klik pada nama calon untuk membuka rubrik 6 domain penilaian temu duga dan melihat profil radar calon.
                        </p>
                      </div>
                    ) : (
                      <div className="space-y-6 animate-[fadeIn_0.3s_ease-in-out]">
                        
                        {/* MAKLUMAT CALON TERPILIH */}
                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-wrap justify-between items-center gap-4">
                          <div>
                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">CALON SEDANG DINILAI:</span>
                            <h2 className="text-base font-black text-slate-100 uppercase">{safeStr(selectedCalon.nama_penuh)}</h2>
                            <p className="text-xs font-mono text-amber-400 mt-0.5">
                              No. KP: {selectedCalon.no_kp} | PPD: {safeStr(selectedCalon.ppd)} | Opsyen: {safeStr(selectedCalon.sme_subjek)}
                            </p>
                            <p className="text-[10px] text-slate-400 uppercase mt-0.5">
                              Zon: {selectedCalon.zon_temuduga} | Pusat: {selectedCalon.pusat_temuduga || '-'} | Sesi: {selectedCalon.sesi}
                            </p>
                          </div>

                          <div className="text-right">
                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">MARKAH TERKINI:</span>
                            <span className="text-3xl font-black text-emerald-400">{jumlahMarkah}%</span>
                            <span className={`block text-[10px] font-bold uppercase ${jumlahMarkah >= 75 ? 'text-emerald-400' : 'text-rose-400'}`}>
                              {jumlahMarkah >= 75 ? 'Status: LAYAK' : 'Status: BELUM LAYAK'}
                            </span>
                          </div>
                        </div>

                        {/* CARTA RADAR KOMPETENSI */}
                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                          <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 border-b border-slate-900 pb-2">
                            PROFIL PENGUASAAN RADAR KOMPETENSI
                          </h4>
                          <RadarIndividuChart scores={skorForm} />
                        </div>

                        {/* BORANG INPUT 6 DOMAIN KOMPETENSI (SKALA 1 - 5) */}
                        <form onSubmit={handleSavePenilaian} className="space-y-5">
                          <div className="space-y-3">
                            <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider border-b border-slate-800 pb-2">
                              Pemberian Skor Penilaian (Skala 1 - 5)
                            </h4>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                              
                              {/* 1. BIMBINGAN (25%) */}
                              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                                <div className="flex justify-between items-center mb-1">
                                  <label className="text-xs font-bold text-slate-200">1. BIMBINGAN & PEMENTORAN (25%)</label>
                                  <span className="text-xs font-black text-amber-400">{((skorForm.bimbingan/5)*25).toFixed(1)}%</span>
                                </div>
                                <select 
                                  value={skorForm.bimbingan} 
                                  onChange={e => setSkorForm({...skorForm, bimbingan: Number(e.target.value)})} 
                                  className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs font-bold text-slate-100"
                                >
                                  <option value={0}>-- Pilih Skor (1-5) --</option>
                                  <option value={1}>1 - Sangat Terhad</option>
                                  <option value={2}>2 - Terhad</option>
                                  <option value={3}>3 - Memuaskan</option>
                                  <option value={4}>4 - Baik</option>
                                  <option value={5}>5 - Cemerlang</option>
                                </select>
                              </div>

                              {/* 2. INSTRUKSIONAL (20%) */}
                              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                                <div className="flex justify-between items-center mb-1">
                                  <label className="text-xs font-bold text-slate-200">2. KEPIMPINAN INSTRUKSIONAL (20%)</label>
                                  <span className="text-xs font-black text-amber-400">{((skorForm.instruksional/5)*20).toFixed(1)}%</span>
                                </div>
                                <select 
                                  value={skorForm.instruksional} 
                                  onChange={e => setSkorForm({...skorForm, instruksional: Number(e.target.value)})} 
                                  className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs font-bold text-slate-100"
                                >
                                  <option value={0}>-- Pilih Skor (1-5) --</option>
                                  <option value={1}>1 - Sangat Terhad</option>
                                  <option value={2}>2 - Terhad</option>
                                  <option value={3}>3 - Memuaskan</option>
                                  <option value={4}>4 - Baik</option>
                                  <option value={5}>5 - Cemerlang</option>
                                </select>
                              </div>

                              {/* 3. STRATEGIK (20%) */}
                              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                                <div className="flex justify-between items-center mb-1">
                                  <label className="text-xs font-bold text-slate-200">3. PEMIKIRAN STRATEGIK (20%)</label>
                                  <span className="text-xs font-black text-amber-400">{((skorForm.strategik/5)*20).toFixed(1)}%</span>
                                </div>
                                <select 
                                  value={skorForm.strategik} 
                                  onChange={e => setSkorForm({...skorForm, strategik: Number(e.target.value)})} 
                                  className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs font-bold text-slate-100"
                                >
                                  <option value={0}>-- Pilih Skor (1-5) --</option>
                                  <option value={1}>1 - Sangat Terhad</option>
                                  <option value={2}>2 - Terhad</option>
                                  <option value={3}>3 - Memuaskan</option>
                                  <option value={4}>4 - Baik</option>
                                  <option value={5}>5 - Cemerlang</option>
                                </select>
                              </div>

                              {/* 4. ANALISIS DATA (15%) */}
                              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                                <div className="flex justify-between items-center mb-1">
                                  <label className="text-xs font-bold text-slate-200">4. KEMAHIRAN ANALISIS DATA (15%)</label>
                                  <span className="text-xs font-black text-amber-400">{((skorForm.data/5)*15).toFixed(1)}%</span>
                                </div>
                                <select 
                                  value={skorForm.data} 
                                  onChange={e => setSkorForm({...skorForm, data: Number(e.target.value)})} 
                                  className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs font-bold text-slate-100"
                                >
                                  <option value={0}>-- Pilih Skor (1-5) --</option>
                                  <option value={1}>1 - Sangat Terhad</option>
                                  <option value={2}>2 - Terhad</option>
                                  <option value={3}>3 - Memuaskan</option>
                                  <option value={4}>4 - Baik</option>
                                  <option value={5}>5 - Cemerlang</option>
                                </select>
                              </div>

                              {/* 5. INTERPERSONAL (10%) */}
                              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                                <div className="flex justify-between items-center mb-1">
                                  <label className="text-xs font-bold text-slate-200">5. HUBUNGAN INTERPERSONAL (10%)</label>
                                  <span className="text-xs font-black text-amber-400">{((skorForm.interpersonal/5)*10).toFixed(1)}%</span>
                                </div>
                                <select 
                                  value={skorForm.interpersonal} 
                                  onChange={e => setSkorForm({...skorForm, interpersonal: Number(e.target.value)})} 
                                  className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs font-bold text-slate-100"
                                >
                                  <option value={0}>-- Pilih Skor (1-5) --</option>
                                  <option value={1}>1 - Sangat Terhad</option>
                                  <option value={2}>2 - Terhad</option>
                                  <option value={3}>3 - Memuaskan</option>
                                  <option value={4}>4 - Baik</option>
                                  <option value={5}>5 - Cemerlang</option>
                                </select>
                              </div>

                              {/* 6. EVIDENS (10%) */}
                              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                                <div className="flex justify-between items-center mb-1">
                                  <label className="text-xs font-bold text-slate-200">6. EVIDENS & SUMBANGAN (10%)</label>
                                  <span className="text-xs font-black text-amber-400">{((skorForm.evidens/5)*10).toFixed(1)}%</span>
                                </div>
                                <select 
                                  value={skorForm.evidens} 
                                  onChange={e => setSkorForm({...skorForm, evidens: Number(e.target.value)})} 
                                  className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs font-bold text-slate-100"
                                >
                                  <option value={0}>-- Pilih Skor (1-5) --</option>
                                  <option value={1}>1 - Sangat Terhad</option>
                                  <option value={2}>2 - Terhad</option>
                                  <option value={3}>3 - Memuaskan</option>
                                  <option value={4}>4 - Baik</option>
                                  <option value={5}>5 - Cemerlang</option>
                                </select>
                              </div>

                            </div>
                          </div>

                          {/* ULASAN PANEL */}
                          <div className="space-y-1">
                            <label className="block text-xs font-bold text-slate-300 uppercase">Ulasan / Catatan Panel Penemuduga:</label>
                            <textarea 
                              rows="3" 
                              placeholder="Masukkan justifikasi penguasaan, kekuatan dan aspek sokongan calon..." 
                              className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-100 focus:border-amber-500 focus:outline-none" 
                              value={skorForm.ulasan} 
                              onChange={e => setSkorForm({...skorForm, ulasan: e.target.value})} 
                            />
                          </div>

                          {/* BUTANG SIMPAN */}
                          <button 
                            type="submit" 
                            disabled={saving} 
                            className="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black rounded-xl text-sm shadow-xl transition-transform active:scale-95 uppercase tracking-wider"
                          >
                            {saving ? 'Sedang Menyimpan...' : '💾 Simpan Markah Penilaian Calon'}
                          </button>
                        </form>

                      </div>
                    )}
                  </div>

                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<PanelApp />);
    </script>
  </body>
</html>
