<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul Panel Penemuduga - Sistem SISC+</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
         -webkit-appearance: none; margin: 0; 
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const SUPABASE_URL = 'https://beyxrxnuuwegkvziglmg.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_Ei-t0rPawbj3j8EpOOdAvQ_lwPz-oKO';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const safeStr = (val) => (val ? String(val) : '');

      // ==========================================
      // CARTA RADAR KOMPETENSI
      // ==========================================
      function RadarChartPenilaian({ skor }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);

        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartRef.current) chartRef.current.destroy();

          const dataScores = [
            ((skor.skor_bimbingan || 0) / 5) * 25,
            ((skor.skor_instruksional || 0) / 5) * 20,
            ((skor.skor_pemikiran_strategik || 0) / 5) * 20,
            ((skor.skor_analisis_data || 0) / 5) * 15,
            ((skor.skor_interpersonal || 0) / 5) * 10,
            ((skor.skor_evidens || 0) / 5) * 10
          ];

          chartRef.current = new Chart(ctx, {
            type: 'radar',
            data: {
              labels: ['BIMBINGAN', 'INSTRUKSIONAL', 'STRATEGIK', 'ANALISIS', 'INTERPERSONAL', 'EVIDENS'],
              datasets: [{
                label: 'Skor Kompetensi',
                data: dataScores,
                backgroundColor: 'rgba(212, 175, 55, 0.2)',
                borderColor: '#D4AF37',
                borderWidth: 2,
                pointBackgroundColor: '#F59E0B'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                r: {
                  angleLines: { color: '#334155' },
                  grid: { color: '#1e293b' },
                  pointLabels: { font: { size: 10, weight: 'bold' }, color: '#94a3b8' },
                  suggestedMin: 0,
                  suggestedMax: 25
                }
              },
              plugins: { legend: { display: false } }
            }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [skor]);

        return <div className="w-full h-64"><canvas ref={canvasRef}></canvas></div>;
      }

      // ==========================================
      // APLIKASI UTAMA PANEL
      // ==========================================
      function PanelApp() {
        // Auth State
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [currentPanel, setCurrentPanel] = useState(null);
        const [icInput, setIcInput] = useState('');
        const [passInput, setPassInput] = useState('');

        // Selection State
        const [penugasanList, setPenugasanList] = useState([]);
        const [selectedTugas, setSelectedTugas] = useState(null);
        const [calonList, setCalonList] = useState([]);
        const [selectedCalonKp, setSelectedCalonKp] = useState('');
        const [selectedCalon, setSelectedCalon] = useState(null);

        // Form Penilaian
        const [scores, setScores] = useState({
          skor_bimbingan: 0,
          skor_instruksional: 0,
          skor_pemikiran_strategik: 0,
          skor_analisis_data: 0,
          skor_interpersonal: 0,
          skor_evidens: 0,
          ulasan_panel: ''
        });

        const [msg, setMsg] = useState({ type: '', text: '' });
        const [allResults, setAllResults] = useState([]);
        const [filterZonPantau, setFilterZonPantau] = useState('SEMUA');

        // LOG MASUK PANEL
        const handleLogin = async (e) => {
          e.preventDefault();
          setMsg({ type: '', text: '' });

          const { data: panelData, error } = await sb
            .from('panel_penemuduga')
            .select('*')
            .eq('no_kp', icInput.trim())
            .single();

          if (error || !panelData) {
            setMsg({ type: 'error', text: 'No. Kad Pengenalan tidak dijumpai dalam pangkalan data.' });
            return;
          }

          if (panelData.katalaluan && panelData.katalaluan !== passInput.trim()) {
            setMsg({ type: 'error', text: 'Kata laluan tidak tepat. Sila cuba lagi.' });
            return;
          }

          setCurrentPanel(panelData);
          setIsLoggedIn(true);
          fetchPenugasanAndData(panelData.no_kp);
        };

        // TARIK DATA DARI SUPABASE
        const fetchPenugasanAndData = async (no_kp) => {
          const { data: tugasData } = await sb
            .from('penugasan_panel')
            .select('*')
            .eq('no_kp_panel', no_kp);
          if (tugasData) setPenugasanList(tugasData);

          const { data: cData } = await sb.from('calon').select('*').order('nama_penuh', { ascending: true });
          if (cData) setCalonList(cData);

          const { data: rData } = await sb.from('penilaian_skor').select('*');
          if (rData) setAllResults(rData);
        };

        // PENAPISAN CALON PINTAR UNTUK BILIK TEMU DUGA
        const calonBilik = selectedTugas ? calonList.filter(c => {
          const zonSama = safeStr(c.zon_temuduga) === safeStr(selectedTugas.zon_bertugas) || selectedTugas.zon_bertugas === 'SEMUA ZON';
          const sesiBertugas = safeStr(selectedTugas.sesi_bertugas);

          if (sesiBertugas.includes("SEMUA SESI")) {
            return zonSama;
          }

          const namaSesiBersih = sesiBertugas.split(" [")[0].trim();
          return zonSama && safeStr(c.sesi).includes(namaSesiBersih);
        }) : [];

        // BILA CALON DIPILIH
        const handleSelectCalon = (kp) => {
          setSelectedCalonKp(kp);
          const c = calonList.find(cal => cal.no_kp === kp);
          setSelectedCalon(c || null);

          const existingRes = allResults.find(r => safeStr(r.no_kp_calon).trim() === safeStr(kp).trim());
          if (existingRes) {
            setScores({
              skor_bimbingan: existingRes.skor_bimbingan || 0,
              skor_instruksional: existingRes.skor_instruksional || 0,
              skor_pemikiran_strategik: existingRes.skor_pemikiran_strategik || 0,
              skor_analisis_data: existingRes.skor_analisis_data || 0,
              skor_interpersonal: existingRes.skor_interpersonal || 0,
              skor_evidens: existingRes.skor_evidens || 0,
              ulasan_panel: existingRes.ulasan_panel || ''
            });
            setMsg({ type: 'success', text: 'Rekod penilaian calon ini telah dimuatkan. Anda boleh mengemas kini markah.' });
          } else {
            setScores({ skor_bimbingan: 0, skor_instruksional: 0, skor_pemikiran_strategik: 0, skor_analisis_data: 0, skor_interpersonal: 0, skor_evidens: 0, ulasan_panel: '' });
            setMsg({ type: '', text: '' });
          }
        };

        const calcJumlahMarkah = () => {
          const m1 = (Number(scores.skor_bimbingan) / 5) * 25;
          const m2 = (Number(scores.skor_instruksional) / 5) * 20;
          const m3 = (Number(scores.skor_pemikiran_strategik) / 5) * 20;
          const m4 = (Number(scores.skor_analisis_data) / 5) * 15;
          const m5 = (Number(scores.skor_interpersonal) / 5) * 10;
          const m6 = (Number(scores.skor_evidens) / 5) * 10;
          return Number((m1 + m2 + m3 + m4 + m5 + m6).toFixed(1));
        };

        const handleSavePenilaian = async (e) => {
          e.preventDefault();
          if (!selectedCalon || !selectedTugas || !currentPanel) return alert("Sila pilih calon terlebih dahulu.");

          const total = calcJumlahMarkah();
          const isLulus = total >= 75;

          const payload = {
            no_kp_calon: selectedCalon.no_kp,
            nama_panel: currentPanel.nama_penuh,
            zon: selectedTugas.zon_bertugas,
            skor_bimbingan: Number(scores.skor_bimbingan),
            skor_instruksional: Number(scores.skor_instruksional),
            skor_pemikiran_strategik: Number(scores.skor_pemikiran_strategik),
            skor_analisis_data: Number(scores.skor_analisis_data),
            skor_interpersonal: Number(scores.skor_interpersonal),
            skor_evidens: Number(scores.skor_evidens),
            jumlah_markah: total,
            status_lulus: isLulus,
            ulasan_panel: scores.ulasan_panel
          };

          const existingRes = allResults.find(r => safeStr(r.no_kp_calon).trim() === safeStr(selectedCalon.no_kp).trim());

          let err = null;
          if (existingRes) {
            const { error } = await sb.from('penilaian_skor').update(payload).eq('id', existingRes.id);
            err = error;
          } else {
            const { error } = await sb.from('penilaian_skor').insert([payload]);
            err = error;
          }

          if (err) {
            setMsg({ type: 'error', text: 'Gagal menyimpan penilaian: ' + err.message });
          } else {
            setMsg({ type: 'success', text: `Penilaian untuk ${selectedCalon.nama_penuh} berjaya disimpan! (${total}%)` });
            fetchPenugasanAndData(currentPanel.no_kp);
          }
        };

        const handleLogout = () => {
          setIsLoggedIn(false);
          setCurrentPanel(null);
          setSelectedTugas(null);
          setSelectedCalon(null);
          setSelectedCalonKp('');
          setIcInput('');
          setPassInput('');
        };

        return (
          <div className="min-h-screen flex flex-col">
            
            {/* HEADER */}
            <div className="bg-white w-full py-4 px-6 md:px-10 flex justify-between items-center shadow-md z-10 border-b-4 border-amber-500">
              <div className="flex items-center gap-4">
                 <img src="logo-kpm.png" alt="Logo KPM" className="h-12 object-contain" />
                 <span className="font-extrabold text-xl text-slate-900 tracking-wider hidden md:block">MODUL PANEL PENEMUDUGA SISC+</span>
              </div>
              {isLoggedIn && (
                <div className="flex items-center gap-4">
                   <span className="text-sm font-bold text-slate-800 uppercase hidden md:inline">{currentPanel?.nama_penuh}</span>
                   <button onClick={handleLogout} className="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-bold rounded-lg text-sm transition-colors border border-red-200">Log Keluar</button>
                </div>
              )}
            </div>

            <div className="p-6 md:p-10 max-w-7xl mx-auto w-full flex-grow">
              
              {/* SKRIN 1: BORANG LOG MASUK */}
              {!isLoggedIn && (
                <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl mt-12">
                   <div className="text-center mb-6">
                      <span className="text-5xl">📋</span>
                      <h2 className="text-2xl font-extrabold text-amber-400 mt-2">Log Masuk Panel</h2>
                      <p className="text-slate-400 text-xs mt-1">Masukkan No. KP dan Kata Laluan rasmi anda.</p>
                   </div>

                   {msg.text && (
                      <div className={`p-3 mb-4 rounded text-xs font-bold text-center ${msg.type === 'error' ? 'bg-red-900/80 text-red-200 border border-red-500' : 'bg-emerald-900/80 text-emerald-200 border border-emerald-500'}`}>
                         {msg.text}
                      </div>
                   )}

                   <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                         <label className="block text-xs font-bold text-slate-400 uppercase mb-1">No. Kad Pengenalan</label>
                         <input type="text" required placeholder="Contoh: 800101015555" className="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-100 focus:border-amber-500 focus:outline-none font-mono" value={icInput} onChange={e => setIcInput(e.target.value)} />
                      </div>
                      <div>
                         <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Kata Laluan</label>
                         <input type="password" required placeholder="••••••••" className="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-100 focus:border-amber-500 focus:outline-none" value={passInput} onChange={e => setPassInput(e.target.value)} />
                      </div>
                      <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold rounded-lg text-sm shadow-lg transition-transform active:scale-95 mt-2">
                         LOG MASUK SEKARANG
                      </button>
                   </form>
                </div>
              )}

              {/* SKRIN 2: LOBI AGIHAN SURAT PENUGASAN (REKA BENTUK MODEN & KEMAS) */}
              {isLoggedIn && !selectedTugas && (
                <div className="space-y-6">
                   <div className="text-center max-w-2xl mx-auto">
                      <h1 className="text-2xl md:text-3xl font-black text-amber-400 uppercase tracking-wide">SELAMAT DATANG, {currentPanel?.nama_penuh}</h1>
                      <p className="text-slate-400 text-sm mt-1">Sila pilih Surat Penugasan anda di bawah untuk memulakan sesi penilaian calon.</p>
                   </div>

                   {penugasanList.length === 0 ? (
                      <div className="p-12 text-center bg-slate-900 border border-slate-800 rounded-2xl max-w-xl mx-auto mt-8 shadow-2xl">
                         <span className="text-5xl text-slate-600">📂</span>
                         <h3 className="text-lg font-bold text-slate-300 mt-3">Tiada Rekod Penugasan Aktif</h3>
                         <p className="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Akaun anda belum ditugaskan ke mana-mana zon atau sesi. Sila hubungi Urus Setia/Admin untuk tindakan agihan.</p>
                      </div>
                   ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl mx-auto mt-8">
                         {penugasanList.map(tugas => (
                            <div key={tugas.id} className="bg-slate-900 border-2 border-slate-800 hover:border-amber-500/80 rounded-2xl shadow-2xl flex flex-col justify-between overflow-hidden transition-all duration-300 hover:-translate-y-1">
                               
                               {/* HEAD KAD */}
                               <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 p-5 border-b border-slate-800">
                                  <div className="flex justify-between items-center mb-2">
                                     <span className="px-3 py-1 bg-amber-500/20 text-amber-300 font-extrabold text-xs rounded-full border border-amber-500/40 uppercase tracking-wider">
                                        📍 ZON {tugas.zon_bertugas}
                                     </span>
                                     <span className="text-[11px] text-slate-500 font-mono">ID #{tugas.id}</span>
                                  </div>
                                  <h3 className="text-lg font-extrabold text-white mt-2 leading-snug">{tugas.sesi_bertugas}</h3>
                               </div>

                               {/* BADAN KAD */}
                               <div className="p-5 flex-grow flex flex-col justify-center items-center text-center">
                                  <div className="w-full py-2.5 px-4 bg-slate-950/80 border border-slate-800 rounded-xl mb-2">
                                     <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">PERANAN RASMI</p>
                                     <p className="text-xs font-black text-emerald-400 uppercase mt-0.5">{tugas.peranan}</p>
                                  </div>
                               </div>

                               {/* FOOTER & BUTANG MASUK */}
                               <div className="p-5 pt-0">
                                  <button onClick={() => setSelectedTugas(tugas)} className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black rounded-xl text-sm shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
                                     <span>MASUK BILIK TEMU DUGA</span>
                                     <span>➔</span>
                                  </button>
                               </div>

                            </div>
                         ))}
                      </div>
                   )}
                </div>
              )}

              {/* SKRIN 3: BILIK PENILAIAN CALON */}
              {isLoggedIn && selectedTugas && (
                <div className="space-y-8">
                   
                   {/* BAR MAKLUMAT TUGASAN & BUTANG TUKAR */}
                   <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4 shadow">
                      <div className="flex items-center gap-3">
                         <button onClick={() => { setSelectedTugas(null); setSelectedCalon(null); setSelectedCalonKp(''); }} className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-lg border border-slate-700 flex items-center gap-1.5 transition-colors">
                            <span>⬅️</span> <span>Tukar Tugas</span>
                         </button>
                         <div>
                            <span className="text-xs text-slate-400 uppercase font-bold">Penugasan Aktif:</span>
                            <h2 className="text-sm font-extrabold text-amber-400 uppercase">{selectedTugas.zon_bertugas} — {selectedTugas.sesi_bertugas} ({selectedTugas.peranan})</h2>
                         </div>
                      </div>
                      <div className="text-xs text-slate-400 font-bold bg-slate-950 px-4 py-2 rounded-lg border border-slate-800">
                         Jumlah Calon Dalam Bilik: <span className="text-emerald-400 text-sm font-extrabold ml-1">{calonBilik.length} Orang</span>
                      </div>
                   </div>

                   {/* NOTIFIKASI */}
                   {msg.text && (
                      <div className={`p-4 rounded-xl text-sm font-bold text-center shadow-md animate-pulse ${msg.type === 'error' ? 'bg-red-900/80 text-red-200 border border-red-500' : 'bg-emerald-900/80 text-emerald-200 border border-emerald-500'}`}>
                         {msg.text}
                      </div>
                   )}

                   {/* PILIHAN CALON */}
                   <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
                      <label className="block text-xs font-extrabold uppercase text-amber-400 mb-2">PILIH CALON UNTUK DINILAI ({selectedTugas.zon_bertugas} - {selectedTugas.sesi_bertugas})</label>
                      <select className="w-full p-4 border border-slate-700 rounded-xl text-base font-bold bg-slate-950 text-slate-100 focus:border-amber-500 focus:outline-none" value={selectedCalonKp} onChange={e => handleSelectCalon(e.target.value)}>
                         <option value="">-- Sila Pilih Nama Calon --</option>
                         {calonBilik.map(c => {
                            const dinilai = allResults.some(r => safeStr(r.no_kp_calon).trim() === safeStr(c.no_kp).trim());
                            return (
                               <option key={c.no_kp} value={c.no_kp}>
                                  {dinilai ? '✅ ' : '⏳ '} {c.nama_penuh} ({c.no_kp}) - PPD: {c.ppd || 'N/A'} [{c.sesi}]
                               </option>
                            );
                         })}
                      </select>
                   </div>

                   {/* FORM PENILAIAN SKOR */}
                   {selectedCalon && (
                      <form onSubmit={handleSavePenilaian} className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                         
                         {/* KOLUM LEFT & MIDDLE: BORANG MARKAH */}
                         <div className="lg:col-span-2 space-y-6">
                            
                            {/* MAKLUMAT CALON */}
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow flex justify-between items-center">
                               <div>
                                  <h2 className="text-xl font-extrabold text-white uppercase">{selectedCalon.nama_penuh}</h2>
                                  <p className="text-xs text-slate-400 font-mono mt-0.5">NO. KP: {selectedCalon.no_kp} | PPD: {selectedCalon.ppd} | SME: {selectedCalon.sme_subjek || 'N/A'}</p>
                               </div>
                               <span className={`px-4 py-1.5 rounded-full text-xs font-bold border ${selectedCalon.kehadiran === 'HADIR' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-red-500/20 text-red-400 border-red-500/50'}`}>
                                  STATUS: {selectedCalon.kehadiran || 'BELUM'}
                               </span>
                            </div>

                            {/* SLIDER / INPUT SKOR KOMPETENSI (6 ELEMEN) */}
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg space-y-5">
                               <h3 className="text-sm font-extrabold text-amber-400 uppercase border-b border-slate-800 pb-2">Borang Penilaian Kompetensi (Skor 0 - 5)</h3>

                               {/* 1. BIMBINGAN (25%) */}
                               <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                  <div className="flex justify-between items-center mb-2">
                                     <label className="text-sm font-bold text-slate-200">1. BIMBINGAN & PEMENTORAN (25%)</label>
                                     <span className="text-base font-extrabold text-amber-400 bg-slate-900 px-3 py-1 rounded border border-slate-700">{scores.skor_bimbingan} / 5</span>
                                  </div>
                                  <input type="range" min="0" max="5" step="0.5" value={scores.skor_bimbingan} onChange={e => setScores({...scores, skor_bimbingan: e.target.value})} className="w-full accent-amber-500 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                               </div>

                               {/* 2. INSTRUKSIONAL (20%) */}
                               <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                  <div className="flex justify-between items-center mb-2">
                                     <label className="text-sm font-bold text-slate-200">2. KEPIMPINAN INSTRUKSIONAL (20%)</label>
                                     <span className="text-base font-extrabold text-amber-400 bg-slate-900 px-3 py-1 rounded border border-slate-700">{scores.skor_instruksional} / 5</span>
                                  </div>
                                  <input type="range" min="0" max="5" step="0.5" value={scores.skor_instruksional} onChange={e => setScores({...scores, skor_instruksional: e.target.value})} className="w-full accent-amber-500 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                               </div>

                               {/* 3. STRATEGIK (20%) */}
                               <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                  <div className="flex justify-between items-center mb-2">
                                     <label className="text-sm font-bold text-slate-200">3. PEMIKIRAN STRATEGIK (20%)</label>
                                     <span className="text-base font-extrabold text-amber-400 bg-slate-900 px-3 py-1 rounded border border-slate-700">{scores.skor_pemikiran_strategik} / 5</span>
                                  </div>
                                  <input type="range" min="0" max="5" step="0.5" value={scores.skor_pemikiran_strategik} onChange={e => setScores({...scores, skor_pemikiran_strategik: e.target.value})} className="w-full accent-amber-500 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                               </div>

                               {/* 4. ANALISIS DATA (15%) */}
                               <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                  <div className="flex justify-between items-center mb-2">
                                     <label className="text-sm font-bold text-slate-200">4. ANALISIS DATA & PENILAIAN (15%)</label>
                                     <span className="text-base font-extrabold text-amber-400 bg-slate-900 px-3 py-1 rounded border border-slate-700">{scores.skor_analisis_data} / 5</span>
                                  </div>
                                  <input type="range" min="0" max="5" step="0.5" value={scores.skor_analisis_data} onChange={e => setScores({...scores, skor_analisis_data: e.target.value})} className="w-full accent-amber-500 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                               </div>

                               {/* 5. INTERPERSONAL (10%) */}
                               <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                  <div className="flex justify-between items-center mb-2">
                                     <label className="text-sm font-bold text-slate-200">5. KEMAHIRAN INTERPERSONAL (10%)</label>
                                     <span className="text-base font-extrabold text-amber-400 bg-slate-900 px-3 py-1 rounded border border-slate-700">{scores.skor_interpersonal} / 5</span>
                                  </div>
                                  <input type="range" min="0" max="5" step="0.5" value={scores.skor_interpersonal} onChange={e => setScores({...scores, skor_interpersonal: e.target.value})} className="w-full accent-amber-500 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                               </div>

                               {/* 6. EVIDENS (10%) */}
                               <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                  <div className="flex justify-between items-center mb-2">
                                     <label className="text-sm font-bold text-slate-200">6. EVIDENS & PORTFOLIO (10%)</label>
                                     <span className="text-base font-extrabold text-amber-400 bg-slate-900 px-3 py-1 rounded border border-slate-700">{scores.skor_evidens} / 5</span>
                                  </div>
                                  <input type="range" min="0" max="5" step="0.5" value={scores.skor_evidens} onChange={e => setScores({...scores, skor_evidens: e.target.value})} className="w-full accent-amber-500 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                               </div>

                               {/* ULASAN PANEL */}
                               <div className="pt-2">
                                  <label className="block text-xs font-bold text-slate-400 uppercase mb-2">Ulasan Keseluruhan Panel Penemuduga</label>
                                  <textarea rows="3" placeholder="Sila berikan ulasan ringkas mengenai potensi dan prestasi calon..." className="w-full p-4 bg-slate-950 border border-slate-700 rounded-xl text-sm text-slate-100 focus:border-amber-500 focus:outline-none" value={scores.ulasan_panel} onChange={e => setScores({...scores, ulasan_panel: e.target.value})}></textarea>
                               </div>

                            </div>
                         </div>

                         {/* KOLUM RIGHT: CARTA RADAR & RUMUSAN SKOR */}
                         <div className="space-y-6">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg sticky top-6">
                               <h3 className="text-xs font-extrabold text-amber-400 uppercase border-b border-slate-800 pb-2 mb-4 text-center">Rumusan Markah Terkumpul</h3>
                               
                               <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center mb-6">
                                  <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">JUMLAH MARKAH</span>
                                  <p className="text-6xl font-black text-amber-400 mt-2">{calcJumlahMarkah()}%</p>
                                  <div className="mt-3">
                                     <span className={`px-4 py-1.5 rounded-full text-xs font-extrabold ${calcJumlahMarkah() >= 75 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-red-500/20 text-red-400 border border-red-500/50'}`}>
                                        {calcJumlahMarkah() >= 75 ? 'LAYAK (>=75%)' : 'BELUM LAYAK'}
                                     </span>
                                  </div>
                               </div>

                               <RadarChartPenilaian skor={scores} />

                               <button type="submit" className="w-full mt-6 py-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black rounded-xl text-base shadow-xl transition-transform active:scale-95">
                                  💾 SIMPAN PENILAIAN CALON
                               </button>
                            </div>
                         </div>

                      </form>
                   )}

                   {/* BAHAGIAN KHAS: PEMANTAUAN UNTUK KETUA PANEL UTAMA */}
                   {selectedTugas.peranan === 'Ketua Panel Utama' && (
                      <div className="bg-slate-900 border-2 border-amber-500/40 p-6 rounded-2xl shadow-2xl mt-12">
                         <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-800 pb-4">
                            <div>
                               <h2 className="text-lg font-bold text-amber-400 uppercase flex items-center gap-2">🌐 Pusat Pemantauan Keseluruhan Zon (Ketua Panel Utama)</h2>
                               <p className="text-xs text-slate-400 mt-1">Anda mempunyai akses pemantauan markah rasmi di seluruh negara.</p>
                            </div>
                            <select className="p-3 border border-slate-700 rounded-lg bg-slate-950 text-amber-400 font-bold text-sm" value={filterZonPantau} onChange={e => setFilterZonPantau(e.target.value)}>
                               <option value="SEMUA">KESEMUA ZON</option>
                               <option value="UTARA">ZON UTARA</option>
                               <option value="TIMUR">ZON TIMUR</option>
                               <option value="TENGAH">ZON TENGAH</option>
                               <option value="SELATAN">ZON SELATAN</option>
                               <option value="SABAH">ZON SABAH</option>
                               <option value="SARAWAK">ZON SARAWAK</option>
                            </select>
                         </div>

                         <div className="overflow-x-auto max-h-[350px] overflow-y-auto">
                            <table className="w-full text-left text-sm border-collapse">
                               <thead className="bg-slate-950 sticky top-0 shadow">
                                  <tr className="text-amber-400 uppercase text-xs border-b border-slate-800">
                                     <th className="p-3">#</th>
                                     <th className="p-3">Nama Calon</th>
                                     <th className="p-3">No. KP</th>
                                     <th className="p-3">Zon</th>
                                     <th className="p-3">Penilai (Panel)</th>
                                     <th className="p-3 text-center">Markah (%)</th>
                                  </tr>
                               </thead>
                               <tbody>
                                  {allResults.filter(r => filterZonPantau === 'SEMUA' || safeStr(r.zon) === filterZonPantau).length === 0 ? (
                                     <tr><td colSpan="6" className="text-center p-8 text-slate-500 italic">Tiada rekod penilaian di kawasan pilihan.</td></tr>
                                  ) : allResults.filter(r => filterZonPantau === 'SEMUA' || safeStr(r.zon) === filterZonPantau).map((res, idx) => {
                                     const cDetail = calonList.find(c => c.no_kp === res.no_kp_calon);
                                     return (
                                        <tr key={idx} className="border-b border-slate-800 hover:bg-slate-800/50">
                                           <td className="p-3 font-bold text-slate-500">{idx + 1}</td>
                                           <td className="p-3 font-bold">{cDetail ? safeStr(cDetail.nama_penuh) : safeStr(res.no_kp_calon)}</td>
                                           <td className="p-3 font-mono text-slate-400 text-xs">{safeStr(res.no_kp_calon)}</td>
                                           <td className="p-3 font-bold text-amber-300">{safeStr(res.zon)}</td>
                                           <td className="p-3 text-slate-300 text-xs">{safeStr(res.nama_panel)}</td>
                                           <td className="p-3 text-center font-extrabold text-emerald-400">{res.jumlah_markah}%</td>
                                        </tr>
                                     );
                                  })}
                               </tbody>
                            </table>
                         </div>
                      </div>
                   )}

                </div>
              )}

            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<PanelApp />);
    </script>
  </body>
</html>
