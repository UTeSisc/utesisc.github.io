<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul Urus Setia - Sistem SISC+</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const SUPABASE_URL = 'https://beyxrxnuuwegkvziglmg.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_Ei-t0rPawbj3j8EpOOdAvQ_lwPz-oKO';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const safeStr = (val) => (val ? String(val) : '');

      function UrusSetiaApp() {
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [currentUS, setCurrentUS] = useState(null);
        const [icInput, setIcInput] = useState('');
        const [passInput, setPassInput] = useState('');

        const [calonList, setCalonList] = useState([]);
        const [msg, setMsg] = useState({ type: '', text: '' });
        
        const [searchCalon, setSearchCalon] = useState('');
        const [filterZon, setFilterZon] = useState('SEMUA');
        const [filterSesi, setFilterSesi] = useState('SEMUA');

        // LOG MASUK URUS SETIA
        const handleUSLogin = async (e) => {
          e.preventDefault();
          setMsg({ type: '', text: '' });

          const { data: usData, error } = await sb
            .from('urus_setia')
            .select('*')
            .eq('no_kp', icInput.trim())
            .single();

          if (error || !usData) {
            setMsg({ type: 'error', text: 'ID / No. KP Urus Setia tidak dijumpai.' });
            return;
          }

          if (usData.katalaluan && usData.katalaluan !== passInput.trim()) {
            setMsg({ type: 'error', text: 'Kata laluan tidak tepat. Sila cuba lagi.' });
            return;
          }

          setCurrentUS(usData);
          setIsLoggedIn(true);
          fetchCalonData();
        };

        const fetchCalonData = async () => {
          const { data, error } = await sb.from('calon').select('*').order('nama_penuh', { ascending: true });
          if (data) setCalonList(data);
        };

        // KEMAS KINI KEHADIRAN CALON
        const handleKehadiranToggle = async (kp, statusSemasa) => {
          let newStatus = 'HADIR';
          if (statusSemasa === 'HADIR') newStatus = 'TIDAK HADIR';
          else if (statusSemasa === 'TIDAK HADIR') newStatus = 'BELUM';

          const { error } = await sb.from('calon').update({ kehadiran: newStatus }).eq('no_kp', kp);
          if (error) {
            alert('Gagal mengemas kini status: ' + error.message);
          } else {
            fetchCalonData();
          }
        };

        // LOG KELUAR AKAN KEMBALI KE SKRIN LOG MASUK URUS SETIA
        const handleLogoutAccount = () => {
          setIsLoggedIn(false);
          setCurrentUS(null);
          setIcInput('');
          setPassInput('');
        };

        // NAVIGASI KEMBALI KE MENU UTAMA (INDEX)
        const handleGoToMenuUtama = () => {
          window.location.href = 'index.html';
        };

        const availableZonList = [...new Set(calonList.map(c => safeStr(c.zon_temuduga)).filter(Boolean))].sort();
        const availableSesiList = [...new Set(calonList.filter(c => filterZon === 'SEMUA' || safeStr(c.zon_temuduga) === filterZon).map(c => safeStr(c.sesi)).filter(Boolean))].sort();

        const filteredCalons = calonList.filter(c => {
          const matchZon = filterZon === 'SEMUA' || safeStr(c.zon_temuduga) === filterZon;
          const matchSesi = filterSesi === 'SEMUA' || safeStr(c.sesi) === filterSesi;
          const matchSearch = safeStr(c.nama_penuh).toUpperCase().includes(searchCalon.toUpperCase()) || safeStr(c.no_kp).includes(searchCalon);
          return matchZon && matchSesi && matchSearch;
        });

        return (
          <div className="min-h-screen flex flex-col">
            
            {/* HEADER */}
            <div className="bg-white w-full py-4 px-6 md:px-10 flex justify-between items-center shadow-md z-10 border-b-4 border-amber-500">
              <div className="flex items-center gap-4">
                 <img src="logo-kpm.png" alt="Logo KPM" className="h-12 object-contain" />
                 <span className="font-extrabold text-xl text-slate-900 tracking-wider hidden md:block">MODUL URUS SETIA SISC+</span>
              </div>
              <div className="flex items-center gap-4">
                 {isLoggedIn ? (
                    <>
                       <span className="text-sm font-bold text-slate-800 uppercase hidden md:inline">{currentUS?.nama_penuh}</span>
                       <button onClick={handleLogoutAccount} className="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-bold rounded-lg text-sm transition-colors border border-red-200">
                          Log Keluar
                       </button>
                    </>
                 ) : (
                    <button onClick={handleGoToMenuUtama} className="px-4 py-2 bg-amber-50 text-amber-700 hover:bg-amber-100 font-bold rounded-lg text-sm transition-colors border border-amber-300">
                       Menu Utama
                    </button>
                 )}
              </div>
            </div>

            <div className="p-6 md:p-10 max-w-7xl mx-auto w-full flex-grow">
              
              {/* SKRIN 1: LOG MASUK URUS SETIA */}
              {!isLoggedIn && (
                <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl mt-12">
                   <div className="text-center mb-6">
                      <span className="text-5xl">👥</span>
                      <h2 className="text-2xl font-extrabold text-amber-400 mt-2">Log Masuk Urus Setia</h2>
                      <p className="text-slate-400 text-xs mt-1">Masukkan ID / No. KP dan Kata Laluan anda.</p>
                   </div>

                   {msg.text && (
                      <div className={`p-3 mb-4 rounded text-xs font-bold text-center ${msg.type === 'error' ? 'bg-red-900/80 text-red-200 border border-red-500' : 'bg-emerald-900/80 text-emerald-200 border border-emerald-500'}`}>
                         {msg.text}
                      </div>
                   )}

                   <form onSubmit={handleUSLogin} className="space-y-4">
                      <div>
                         <label className="block text-xs font-bold text-slate-400 uppercase mb-1">ID / No. Kad Pengenalan</label>
                         <input type="text" required placeholder="Contoh: US_UTARA_01" className="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-100 focus:border-amber-500 focus:outline-none font-mono" value={icInput} onChange={e => setIcInput(e.target.value)} />
                      </div>
                      <div>
                         <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Kata Laluan</label>
                         <input type="password" required placeholder="••••••••" className="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-100 focus:border-amber-500 focus:outline-none" value={passInput} onChange={e => setPassInput(e.target.value)} />
                      </div>
                      <button type="submit" className="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold rounded-lg text-sm shadow-lg transition-transform active:scale-95 mt-2 uppercase tracking-wider">
                         Log Masuk
                      </button>
                   </form>
                </div>
              )}

              {/* SKRIN 2: PUSAT URUS SETIA & KEHADIRAN CALON */}
              {isLoggedIn && (
                <div className="space-y-6">
                   <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                      <div>
                         <h1 className="text-xl md:text-2xl font-black text-amber-400 uppercase">Pusat Kawalan Kehadiran & Semakan Calon</h1>
                         <p className="text-xs text-slate-400 mt-1">Sila tandakan status kehadiran calon di stesen temu duga.</p>
                      </div>
                      <div className="text-right bg-slate-950 px-4 py-2 rounded-xl border border-slate-800 text-xs font-mono">
                         Jumlah Calon Terdaftar: <span className="text-emerald-400 font-extrabold text-sm">{calonList.length}</span>
                      </div>
                   </div>

                   {/* TAPISAN & CARIAN */}
                   <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg space-y-4">
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                         <div>
                            <label className="block text-xs font-bold text-slate-400 uppercase mb-1">🔍 Carian Calon</label>
                            <input type="text" placeholder="Cari Nama atau No. KP..." className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm text-slate-100 focus:border-amber-500 focus:outline-none" value={searchCalon} onChange={e => setSearchCalon(e.target.value)} />
                         </div>
                         <div>
                            <label className="block text-xs font-bold text-slate-400 uppercase mb-1">📍 Tapis Zon</label>
                            <select className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm font-bold text-amber-400 focus:border-amber-500 focus:outline-none" value={filterZon} onChange={e => { setFilterZon(e.target.value); setFilterSesi('SEMUA'); }}>
                               <option value="SEMUA">KESEMUA ZON</option>
                               {availableZonList.map(z => <option key={z} value={z}>{z}</option>)}
                            </select>
                         </div>
                         <div>
                            <label className="block text-xs font-bold text-slate-400 uppercase mb-1">🕒 Tapis Sesi</label>
                            <select className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm font-bold text-amber-400 focus:border-amber-500 focus:outline-none disabled:opacity-50" value={filterSesi} disabled={filterZon === 'SEMUA'} onChange={e => setFilterSesi(e.target.value)}>
                               <option value="SEMUA">KESEMUA SESI</option>
                               {availableSesiList.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                         </div>
                      </div>
                   </div>

                   {/* JADUAL KEHADIRAN CALON */}
                   <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl overflow-x-auto">
                      <table className="w-full text-left text-sm border-collapse">
                         <thead>
                            <tr className="bg-slate-950 text-amber-400 uppercase text-xs border-b border-slate-800">
                               <th className="p-3">#</th>
                               <th className="p-3">Nama Penuh Calon</th>
                               <th className="p-3">No. KP</th>
                               <th className="p-3">Zon & Sesi</th>
                               <th className="p-3">PPD & Subjek</th>
                               <th className="p-3 text-center">Status Kehadiran</th>
                            </tr>
                         </thead>
                         <tbody>
                            {filteredCalons.length === 0 ? (
                               <tr><td colSpan="6" className="text-center p-8 text-slate-500 italic">Tiada padanan calon dijumpai.</td></tr>
                            ) : filteredCalons.map((c, idx) => (
                               <tr key={c.no_kp} className="border-b border-slate-800 hover:bg-slate-800/50">
                                  <td className="p-3 font-bold text-slate-500">{idx + 1}</td>
                                  <td className="p-3 font-bold text-slate-100 uppercase">{safeStr(c.nama_penuh)}</td>
                                  <td className="p-3 font-mono text-slate-300 text-xs">{safeStr(c.no_kp)}</td>
                                  <td className="p-3 font-bold text-amber-300">
                                     {safeStr(c.zon_temuduga)}
                                     <span className="text-slate-400 font-normal block text-xs mt-0.5">{safeStr(c.sesi)}</span>
                                  </td>
                                  <td className="p-3 text-xs text-slate-300">
                                     {safeStr(c.ppd) || '-'}
                                     <span className="text-slate-400 block text-[11px]">({safeStr(c.sme_subjek) || '-'})</span>
                                  </td>
                                  <td className="p-3 text-center">
                                     <button onClick={() => handleKehadiranToggle(c.no_kp, c.kehadiran)} className={`px-4 py-2 rounded-xl text-xs font-extrabold w-28 transition-all border shadow ${c.kehadiran === 'HADIR' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50 hover:bg-emerald-500/30' : c.kehadiran === 'TIDAK HADIR' ? 'bg-red-500/20 text-red-400 border-red-500/50 hover:bg-red-500/30' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}>
                                        {c.kehadiran || 'BELUM'}
                                     </button>
                                  </td>
                               </tr>
                            ))}
                         </tbody>
                      </table>
                   </div>

                </div>
              )}

            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<UrusSetiaApp />);
    </script>
  </body>
</html>
