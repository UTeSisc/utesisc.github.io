<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul Urus Setia Zon - Sistem SISC+</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; color: black !important; font-family: 'Arial', sans-serif; }
        .print-area { border: none !important; box-shadow: none !important; padding: 0 !important; width: 100% !important; margin: 0 !important; }
        @page { size: A4 portrait; margin: 8mm; }
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const SUPABASE_URL = 'https://beyxrxnuuwegkvziglmg.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_Ei-t0rPawbj3j8EpOOdAvQ_lwPz-oKO';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const safeStr = (val) => (val ? String(val).trim() : '');

      const mapPPDStandard = (rawPpd) => {
         const str = safeStr(rawPpd).toUpperCase();
         if (!str) return 'TIADA PPD';
         if (str.includes('RAMAKRISHNA') || str.includes('TIMUR LAUT')) return 'PPD TIMUR LAUT';
         if (str.includes('TELOI KANAN') || str.includes('BALING')) return 'PPD BALING';
         if (str.includes('TASEK GELUGOR') || str.includes('SEBERANG PERAI UTARA')) return 'PPD SEBERANG PERAI UTARA';
         if (str.includes('SEBERANG PERAI SELATAN')) return 'PPD SEBERANG PERAI SELATAN';
         if (str.includes('SEBERANG PERAI TENGAH')) return 'PPD SEBERANG PERAI TENGAH';
         if (str.includes('BARAT DAYA')) return 'PPD BARAT DAYA';
         if (str.includes('KINTA UTARA')) return 'PPD KINTA UTARA';
         if (str.includes('KINTA SELATAN')) return 'PPD KINTA SELATAN';
         if (str.includes('KUALA KANGSAR')) return 'PPD KUALA KANGSAR';
         if (str.includes('KOTA SETAR')) return 'PPD KOTA SETAR';
         if (str.includes('KULIM') || str.includes('BANDAR BAHARU')) return 'PPD KULIM/BANDAR BAHARU';
         if (str.includes('KUALA MUDA') || str.includes('YAN')) return 'PPD KUALA MUDA';
         if (str.includes('PENDANG')) return 'PPD PENDANG';
         if (str.includes('KUBANG PASU')) return 'PPD KUBANG PASU';
         if (str.includes('LARUT') || str.includes('MATANG') || str.includes('SELAMA')) return 'PPD LARUT MATANG SELAMA';
         if (str.includes('KERIAN')) return 'PPD KERIAN';
         if (str.includes('PADANG TERAP')) return 'PPD PADANG TERAP';
         if (str.includes('HILIR PERAK')) return 'PPD HILIR PERAK';
         if (str.includes('MUALLIM')) return 'PPD MUALLIM';
         if (str.includes('PERLIS') || str.includes('JPN PERLIS')) return 'JPN PERLIS';
         return str.startsWith('PPD ') ? str : `PPD ${str}`;
      };

      const detectJantinaFromKP = (noKp) => {
         const cleanKp = safeStr(noKp).replace(/[^0-9]/g, '');
         if (!cleanKp) return 'LELAKI';
         const lastDigit = parseInt(cleanKp.slice(-1), 10);
         return (lastDigit % 2 === 0) ? 'PEREMPUAN' : 'LELAKI';
      };

      function UrusSetiaApp() {
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [currentUrusSetia, setCurrentUrusSetia] = useState(null);
        const [idInput, setIdInput] = useState('');
        const [passInput, setPassInput] = useState('');

        const [selectedZon, setSelectedZon] = useState('SABAH');
        const [activeTab, setActiveTab] = useState('daftar');
        
        const [calonList, setCalonList] = useState([]);
        const [panelList, setPanelList] = useState([]);
        const [penugasanList, setPenugasanList] = useState([]);
        const [penilaianList, setPenilaianList] = useState([]);

        const [filterSesi, setFilterSesi] = useState('SEMUA');
        const [minScore, setMinScore] = useState(50);
        const [msg, setMsg] = useState({ type: '', text: '' });

        const [editingCalonKp, setEditingCalonKp] = useState(null);
        const [formCalon, setFormCalon] = useState({
           nama_penuh: '',
           no_kp: '',
           ppd: '',
           sme_subjek: '',
           sesi: 'SESI 1',
           kehadiran: 'BELUM'
        });

        // ENJIN LOG MASUK MULTI-LAJUR (DIPERBAIKI)
        const handleLogin = async (e) => {
          e.preventDefault();
          setMsg({ type: '', text: '' });

          const cleanId = safeStr(idInput).replace(/[^a-zA-Z0-9_]/g, '');
          const cleanPass = safeStr(passInput);

          // AKAN RIZAF UNTUK URUS SETIA BPG UTAMA
          if (cleanId.toLowerCase() === 'urusetia' && cleanPass === 'bpg2026') {
             const bpgObj = { nama_penuh: 'URUS SETIA BPG', id: 'urusetia', zon: 'SEMUA' };
             setCurrentUrusSetia(bpgObj);
             setSelectedZon('SEMUA');
             setIsLoggedIn(true);
             fetchData();
             return;
          }

          // TARIK KESELURUHAN PROFIL URUS SETIA UNTUK PADANAN SELAMAT
          const { data: allUS, error } = await sb.from('urus_setia').select('*');

          if (error || !allUS || allUS.length === 0) {
             setMsg({ type: 'error', text: 'Gagal menghubung pangkalan data urus_setia.' });
             return;
          }

          // CARIAN PADANAN KP / ID MULTI-LAJUR
          const matchedUser = allUS.find(u => {
             const kpVal = safeStr(u.no_kp || u.id_no_kp || u.id || u.no_ic);
             return kpVal === cleanId || kpVal === safeStr(idInput);
          });

          if (!matchedUser) {
             setMsg({ type: 'error', text: 'ID / No. KP Urus Setia tidak dijumpai dalam pangkalan data.' });
             return;
          }

          // SEMAKAN KATA LALUAN MULTI-LAJUR
          const dbPass = safeStr(matchedUser.kata_laluan || matchedUser.katalaluan || matchedUser.password);
          if (dbPass && dbPass !== cleanPass) {
             setMsg({ type: 'error', text: 'Kata laluan tidak tepat. Sila cuba lagi.' });
             return;
          }

          setCurrentUrusSetia(matchedUser);
          
          let uZon = safeStr(matchedUser.zon || matchedUser.kata_laluan || matchedUser.katalaluan).toUpperCase();
          if (uZon.includes('SABAH')) setSelectedZon('SABAH');
          else if (uZon.includes('UTARA')) setSelectedZon('UTARA');
          else if (uZon.includes('TIMUR')) setSelectedZon('TIMUR');
          else if (uZon.includes('TENGAH')) setSelectedZon('TENGAH');
          else if (uZon.includes('SELATAN')) setSelectedZon('SELATAN');
          else if (uZon.includes('SARAWAK')) setSelectedZon('SARAWAK');
          else setSelectedZon('SEMUA');

          setIsLoggedIn(true);
          fetchData();
        };

        const fetchData = async () => {
          const { data: cData } = await sb.from('calon').select('*').order('nama_penuh', { ascending: true });
          if (cData) setCalonList(cData);

          const { data: pData } = await sb.from('panel_penemuduga').select('*');
          if (pData) setPanelList(pData);

          const { data: tData } = await sb.from('penugasan_panel').select('*');
          if (tData) setPenugasanList(tData);

          const { data: rData } = await sb.from('penilaian_skor').select('*');
          if (rData) setPenilaianList(rData);
        };

        useEffect(() => {
          if (isLoggedIn) fetchData();
        }, [isLoggedIn, selectedZon]);

        const handleSaveCalon = async (e) => {
           e.preventDefault();
           setMsg({ type: '', text: '' });

           if (!formCalon.nama_penuh.trim() || !formCalon.no_kp.trim()) {
              return alert("Sila lengkapkan Nama Penuh dan No. KP calon.");
           }

           const payload = {
              nama_penuh: safeStr(formCalon.nama_penuh).toUpperCase(),
              no_kp: safeStr(formCalon.no_kp),
              ppd: safeStr(formCalon.ppd).toUpperCase(),
              sme_subjek: safeStr(formCalon.sme_subjek).toUpperCase(),
              zon_temuduga: selectedZon === 'SEMUA' ? 'SABAH' : selectedZon,
              sesi: safeStr(formCalon.sesi).toUpperCase(),
              kehadiran: formCalon.kehadiran
           };

           let err = null;
           if (editingCalonKp) {
              const { error } = await sb.from('calon').update(payload).eq('no_kp', editingCalonKp);
              err = error;
           } else {
              const { error } = await sb.from('calon').insert([payload]);
              err = error;
           }

           if (err) {
              setMsg({ type: 'error', text: 'Gagal menyimpan calon: ' + err.message });
           } else {
              setMsg({ type: 'success', text: `Calon ${payload.nama_penuh} berjaya disimpan!` });
              setFormCalon({ nama_penuh: '', no_kp: '', ppd: '', sme_subjek: '', sesi: 'SESI 1', kehadiran: 'BELUM' });
              setEditingCalonKp(null);
              fetchData();
           }
        };

        const handleEditCalonClick = (c) => {
           setEditingCalonKp(c.no_kp);
           setFormCalon({
              nama_penuh: c.nama_penuh || '',
              no_kp: c.no_kp || '',
              ppd: c.ppd || '',
              sme_subjek: c.sme_subjek || '',
              sesi: c.sesi || 'SESI 1',
              kehadiran: c.kehadiran || 'BELUM'
           });
        };

        const handleDeleteCalonClick = async (kp) => {
           if (!confirm(`Adakah anda pasti mahu memadam calon No. KP: ${kp}?`)) return;
           const { error } = await sb.from('calon').delete().eq('no_kp', kp);
           if (error) alert('Gagal memadam: ' + error.message);
           else {
              alert('Calon berjaya dipadam.');
              fetchData();
           }
        };

        const filteredCalon = calonList.filter(c => {
           const padanZon = selectedZon === 'SEMUA' || safeStr(c.zon_temuduga).toUpperCase() === selectedZon;
           if (!padanZon) return false;
           if (filterSesi === 'SEMUA') return true;
           return safeStr(c.sesi).toUpperCase().includes(filterSesi);
        });

        const consolidatedCalon = filteredCalon.map(c => {
           const cRes = penilaianList.filter(r => safeStr(r.no_kp_calon) === safeStr(c.no_kp));
           if (cRes.length === 0) {
              return {
                 ...c,
                 jantina: detectJantinaFromKP(c.no_kp),
                 ppdClean: mapPPDStandard(c.ppd),
                 totalMarkah: 0,
                 statusDinilai: 'BELUM'
              };
           }

           let sums = { bimb:0, inst:0, strat:0, data:0, inter:0, evi:0 };
           let counts = { bimb:0, inst:0, strat:0, data:0, inter:0, evi:0 };

           cRes.forEach(r => {
              if (Number(r.skor_bimbingan) > 0) { sums.bimb += Number(r.skor_bimbingan); counts.bimb++; }
              if (Number(r.skor_instruksional) > 0) { sums.inst += Number(r.skor_instruksional); counts.inst++; }
              if (Number(r.skor_pemikiran_strategik) > 0) { sums.strat += Number(r.skor_pemikiran_strategik); counts.strat++; }
              if (Number(r.skor_analisis_data) > 0) { sums.data += Number(r.skor_analisis_data); counts.data++; }
              if (Number(r.skor_interpersonal) > 0) { sums.inter += Number(r.skor_interpersonal); counts.inter++; }
              if (Number(r.skor_evidens) > 0) { sums.evi += Number(r.skor_evidens); counts.evi++; }
           });

           const avgBimb = counts.bimb > 0 ? (sums.bimb / counts.bimb) : 0;
           const avgInst = counts.inst > 0 ? (sums.inst / counts.inst) : 0;
           const avgStrat = counts.strat > 0 ? (sums.strat / counts.strat) : 0;
           const avgData = counts.data > 0 ? (sums.data / counts.data) : 0;
           const avgInter = counts.inter > 0 ? (sums.inter / counts.inter) : 0;
           const avgEvi = counts.evi > 0 ? (sums.evi / counts.evi) : 0;

           const total = Number((
              (avgBimb / 5) * 25 +
              (avgInst / 5) * 20 +
              (avgStrat / 5) * 20 +
              (avgData / 5) * 15 +
              (avgInter / 5) * 10 +
              (avgEvi / 5) * 10
           ).toFixed(1));

           return {
              ...c,
              jantina: detectJantinaFromKP(c.no_kp),
              ppdClean: mapPPDStandard(c.ppd),
              totalMarkah: total,
              statusDinilai: 'SELESAI'
           };
        });

        const panelZonList = () => {
           let mapComplete = {};
           penugasanList.forEach(t => {
              if (selectedZon === 'SEMUA' || safeStr(t.zon_bertugas).toUpperCase() === selectedZon) {
                 const kp = safeStr(t.no_kp_panel);
                 if (kp) mapComplete[kp] = safeStr(t.peranan).toUpperCase();
              }
           });

           return Object.keys(mapComplete).map((kp, idx) => {
              const pObj = panelList.find(p => safeStr(p.no_kp) === kp || safeStr(p.nama_penuh).toUpperCase() === kp);
              return {
                 bil: idx + 1,
                 nama: pObj ? safeStr(pObj.nama_penuh).toUpperCase() : kp,
                 no_kp: kp,
                 jawatan: pObj ? (safeStr(pObj.jawatan).toUpperCase() || 'PEG. PERKHIDMATAN PENDIDIKAN') : 'PEG. PERKHIDMATAN PENDIDIKAN',
                 tempat_bertugas: pObj ? (safeStr(pObj.tempat_bertugas).toUpperCase() || 'KEMENTERIAN PENDIDIKAN MALAYSIA') : 'KEMENTERIAN PENDIDIKAN MALAYSIA',
                 peranan: mapComplete[kp]
              };
           });
        };

        const handleDownloadCalonExcel = () => {
          let csvContent = "BIL,NAMA CALON,JANTINA,NO. KAD PENGENALAN,SUBJEK,PPD,SESI,KEHADIRAN,MARKAH (%)\n";
          consolidatedCalon.forEach((c, idx) => {
             const row = [
                idx + 1,
                `"${safeStr(c.nama_penuh).replace(/"/g, '""')}"`,
                `"${c.jantina}"`,
                `="${c.no_kp}"`,
                `"${safeStr(c.sme_subjek)}"`,
                `"${c.ppdClean}"`,
                `"${safeStr(c.sesi)}"`,
                `"${safeStr(c.kehadiran) || 'BELUM'}"`,
                c.totalMarkah
             ];
             csvContent += row.join(",") + "\n";
          });
          const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement("a");
          link.setAttribute("href", URL.createObjectURL(blob));
          link.setAttribute("download", `Senarai_Calon_SISC_Zon_${selectedZon}.csv`);
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        return (
          <div className="min-h-screen flex flex-col">
            
            {/* HEADER */}
            <div className="bg-white w-full py-4 px-6 md:px-10 flex justify-between items-center shadow-md z-10 border-b-4 border-emerald-600 no-print">
              <div className="flex items-center gap-4">
                 <img src="logo-kpm.png" alt="Logo KPM" className="h-12 object-contain" />
                 <div>
                    <span className="font-extrabold text-lg text-slate-900 tracking-wider block">MODUL URUS SETIA ZON SISC+</span>
                    <span className="text-xs text-slate-500 font-bold uppercase">Pendaftaran Calon & Pusat Cetakan Zon</span>
                 </div>
              </div>
              {isLoggedIn && (
                 <div className="flex items-center gap-4">
                    <div className="text-right">
                       <span className="text-xs font-black text-slate-800 uppercase block">{safeStr(currentUrusSetia?.nama_penuh).toUpperCase()}</span>
                       <span className="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded border border-emerald-300 inline-block mt-0.5">
                          📍 ZON {selectedZon}
                       </span>
                    </div>
                    <button onClick={() => setIsLoggedIn(false)} className="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-bold rounded-lg text-xs transition-colors border border-red-200">
                       Log Keluar
                    </button>
                 </div>
              )}
            </div>

            <div className="p-6 md:p-10 max-w-7xl mx-auto w-full flex-grow">
              
              {/* LOG MASUK URUS SETIA */}
              {!isLoggedIn && (
                <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl mt-12">
                   <div className="text-center mb-6">
                      <span className="text-5xl">🏛️</span>
                      <h2 className="text-2xl font-extrabold text-emerald-400 mt-2">Log Masuk Urus Setia</h2>
                      <p className="text-slate-400 text-xs mt-1">Masukkan ID / No. KP dan Kata Laluan profil Urus Setia anda.</p>
                   </div>

                   {msg.text && (
                      <div className={`p-3 mb-4 rounded text-xs font-bold text-center ${msg.type === 'error' ? 'bg-red-900/80 text-red-200 border border-red-500' : 'bg-emerald-900/80 text-emerald-200 border border-emerald-500'}`}>
                         {msg.text}
                      </div>
                   )}

                   <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                         <label className="block text-xs font-bold text-slate-400 uppercase mb-1">ID / No. Kad Pengenalan</label>
                         <input type="text" required placeholder="Contoh: 830322055374 / urusetia" className="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-100 focus:border-emerald-500 focus:outline-none font-mono" value={idInput} onChange={e => setIdInput(e.target.value)} />
                      </div>

                      <div>
                         <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Kata Laluan</label>
                         <input type="password" required placeholder="••••••••" className="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-100 focus:border-emerald-500 focus:outline-none" value={passInput} onChange={e => setPassInput(e.target.value)} />
                      </div>

                      <button type="submit" className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black rounded-lg text-sm shadow-lg transition-transform active:scale-95 mt-2">
                         Log Masuk Modul Urus Setia
                      </button>
                   </form>
                </div>
              )}

              {/* DASHBOARD URUS SETIA ZON */}
              {isLoggedIn && (
                <div className="space-y-6">
                   
                   {msg.text && (
                      <div className={`p-4 rounded-xl text-sm font-bold text-center shadow-md animate-pulse no-print ${msg.type === 'error' ? 'bg-red-900/80 text-red-200 border border-red-500' : 'bg-emerald-900/80 text-emerald-200 border border-emerald-500'}`}>
                         {msg.text}
                      </div>
                   )}

                   {/* TAB NAVIGATION */}
                   <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4 no-print">
                      <div className="flex flex-wrap gap-2">
                         <button onClick={() => setActiveTab('daftar')} className={`px-5 py-2.5 rounded-xl font-extrabold text-xs transition-all border ${activeTab === 'daftar' ? 'bg-emerald-500 text-slate-950 border-emerald-400 shadow-lg' : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'}`}>
                            📝 Pendaftaran & Cetakan Calon
                         </button>
                         <button onClick={() => setActiveTab('panel')} className={`px-5 py-2.5 rounded-xl font-extrabold text-xs transition-all border ${activeTab === 'panel' ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-lg' : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'}`}>
                            📋 Panel Penemuduga Zon
                         </button>
                         <button onClick={() => setActiveTab('keputusan')} className={`px-5 py-2.5 rounded-xl font-extrabold text-xs transition-all border ${activeTab === 'keputusan' ? 'bg-blue-500 text-white border-blue-400 shadow-lg' : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'}`}>
                            🖨️ Laporan Keputusan Rasmi A4
                         </button>
                      </div>

                      {currentUrusSetia?.zon === 'SEMUA' && (
                         <div className="flex items-center gap-2 bg-slate-900 p-2 rounded-xl border border-slate-800">
                            <span className="text-xs text-slate-400 font-bold uppercase">Pilih Zon:</span>
                            <select className="p-1.5 bg-slate-950 border border-slate-700 rounded text-xs font-bold text-amber-400" value={selectedZon} onChange={e => setSelectedZon(e.target.value)}>
                               <option value="SEMUA">KESEMUA ZON</option>
                               <option value="UTARA">ZON UTARA</option>
                               <option value="TIMUR">ZON TIMUR</option>
                               <option value="TENGAH">ZON TENGAH</option>
                               <option value="SELATAN">ZON SELATAN</option>
                               <option value="SABAH">ZON SABAH</option>
                               <option value="SARAWAK">ZON SARAWAK</option>
                            </select>
                         </div>
                      )}
                   </div>

                   {/* TAB 1: PENDAFTARAN & CETAKAN CALON ZON (CRUD PENUH) */}
                   {activeTab === 'daftar' && (
                      <div className="space-y-6">
                         
                         {/* BORANG TAMBAH / EDIT CALON */}
                         <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4 no-print">
                            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                               <h3 className="text-sm font-extrabold text-emerald-400 uppercase">
                                  {editingCalonKp ? '✏️ Kemas Kini Maklumat Calon' : '➕ Pendaftaran Calon Baharu (' + selectedZon + ')'}
                               </h3>
                               {editingCalonKp && (
                                  <button onClick={() => { setEditingCalonKp(null); setFormCalon({ nama_penuh: '', no_kp: '', ppd: '', sme_subjek: '', sesi: 'SESI 1', kehadiran: 'BELUM' }); }} className="text-xs font-bold text-red-400 hover:underline">
                                     ✖️ Batal Edit
                                  </button>
                               )}
                            </div>

                            <form onSubmit={handleSaveCalon} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                               <div>
                                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Nama Penuh Calon</label>
                                  <input type="text" required placeholder="Contoh: YVAN HAZEL JIMIS" className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs font-bold text-slate-100 uppercase focus:border-emerald-500 focus:outline-none" value={formCalon.nama_penuh} onChange={e => setFormCalon({...formCalon, nama_penuh: e.target.value})} />
                               </div>

                               <div>
                                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">No. Kad Pengenalan</label>
                                  <input type="text" required disabled={!!editingCalonKp} placeholder="Contoh: 790716125052" className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs font-mono text-slate-100 focus:border-emerald-500 focus:outline-none disabled:opacity-50" value={formCalon.no_kp} onChange={e => setFormCalon({...formCalon, no_kp: e.target.value})} />
                               </div>

                               <div>
                                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Pejabat Pendidikan Daerah (PPD)</label>
                                  <input type="text" placeholder="Contoh: PPD SIPITANG" className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs font-bold text-slate-100 uppercase focus:border-emerald-500 focus:outline-none" value={formCalon.ppd} onChange={e => setFormCalon({...formCalon, ppd: e.target.value})} />
                               </div>

                               <div>
                                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Bidang Kepakaran (SME)</label>
                                  <input type="text" placeholder="Contoh: SAINS / BAHASA MELAYU" className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs font-bold text-slate-100 uppercase focus:border-emerald-500 focus:outline-none" value={formCalon.sme_subjek} onChange={e => setFormCalon({...formCalon, sme_subjek: e.target.value})} />
                               </div>

                               <div>
                                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Sesi Temu Duga</label>
                                  <select className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs font-bold text-amber-400 focus:border-emerald-500 focus:outline-none" value={formCalon.sesi} onChange={e => setFormCalon({...formCalon, sesi: e.target.value})}>
                                     <option value="SESI 1">SESI 1</option>
                                     <option value="SESI 2">SESI 2</option>
                                     <option value="SESI 3">SESI 3</option>
                                     <option value="SESI 4">SESI 4</option>
                                     <option value="SESI 5">SESI 5</option>
                                     <option value="SESI 6">SESI 6</option>
                                     <option value="SESI KHAS">SESI KHAS</option>
                                  </select>
                               </div>

                               <div>
                                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Status Kehadiran</label>
                                  <select className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs font-bold text-emerald-400 focus:border-emerald-500 focus:outline-none" value={formCalon.kehadiran} onChange={e => setFormCalon({...formCalon, kehadiran: e.target.value})}>
                                     <option value="BELUM">BELUM HADIR</option>
                                     <option value="HADIR">HADIR</option>
                                     <option value="TIDAK HADIR">TIDAK HADIR</option>
                                  </select>
                               </div>

                               <div className="md:col-span-3 flex justify-end gap-2 pt-2">
                                  <button type="submit" className="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black px-6 py-2.5 rounded-lg text-xs shadow transition-transform active:scale-95">
                                     {editingCalonKp ? '💾 SIMPAN KEMAS KINI' : '➕ DAFTAR CALON BAHARU'}
                                  </button>
                               </div>
                            </form>
                         </div>

                         {/* BAR KAWALAN CETAKAN & TAPISAN */}
                         <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex flex-col md:flex-row justify-between items-center gap-4 no-print">
                            <div>
                               <h3 className="text-base font-extrabold text-slate-200 uppercase">Senarai Calon Terdaftar Zon {selectedZon}</h3>
                               <p className="text-xs text-slate-400 mt-0.5">Jumlah Calon: <b className="text-emerald-400">{consolidatedCalon.length} Orang</b></p>
                            </div>

                            <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                               <div className="flex items-center gap-2">
                                  <span className="text-xs text-slate-400 font-bold uppercase">Sesi:</span>
                                  <select className="p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-xs font-bold text-amber-400" value={filterSesi} onChange={e => setFilterSesi(e.target.value)}>
                                     <option value="SEMUA">KESEMUA SESI</option>
                                     <option value="SESI 1">SESI 1</option>
                                     <option value="SESI 2">SESI 2</option>
                                     <option value="SESI 3">SESI 3</option>
                                     <option value="SESI 4">SESI 4</option>
                                     <option value="SESI 5">SESI 5</option>
                                     <option value="SESI 6">SESI 6</option>
                                     <option value="SESI KHAS">SESI KHAS</option>
                                  </select>
                               </div>

                               <button onClick={handleDownloadCalonExcel} className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-4 py-2.5 rounded-lg text-xs shadow transition-transform active:scale-95">📊 Muat Turun CSV</button>
                               <button onClick={() => window.print()} className="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold px-4 py-2.5 rounded-lg text-xs shadow transition-transform active:scale-95">🖨️ Cetak Senarai A4</button>
                            </div>
                         </div>

                         {/* JADUAL CETAKAN CALON HTML RASMI KPM */}
                         <div className="bg-white p-8 border rounded-xl print-area text-slate-900 shadow-xl overflow-x-auto">
                            <div className="text-center mb-6">
                               <img src="logo-kpm.png" alt="Logo KPM" className="h-16 mx-auto mb-2 object-contain" />
                               <h3 className="text-xs font-bold uppercase tracking-wider">Kementerian Pendidikan Malaysia</h3>
                               <h4 className="text-[11px] font-semibold text-slate-600 uppercase">Bahagian Profesionalisme Guru</h4>
                               <h2 className="text-base font-black uppercase mt-2 text-slate-900 border-b-2 border-slate-900 pb-1 inline-block">
                                  SENARAI DAFTAR CALON SELEKSI PEGAWAI SISC+ (ZON {selectedZon})
                               </h2>
                               <p className="text-xs font-bold text-slate-700 mt-1">Sesi: {filterSesi} | Tarikh Janaan: {new Date().toLocaleDateString('en-GB')}</p>
                            </div>

                            <table className="w-full text-xs border-collapse border border-slate-400">
                               <thead>
                                  <tr className="bg-slate-200 border-b border-slate-400 text-center font-bold">
                                     <th className="p-2 border-r border-slate-400 w-10">#</th>
                                     <th className="p-2 border-r border-slate-400 text-left">NAMA CALON</th>
                                     <th className="p-2 border-r border-slate-400">JANTINA</th>
                                     <th className="p-2 border-r border-slate-400">NO. KP</th>
                                     <th className="p-2 border-r border-slate-400">SUBJEK (SME)</th>
                                     <th className="p-2 border-r border-slate-400">PPD</th>
                                     <th className="p-2 border-r border-slate-400">SESI</th>
                                     <th className="p-2 border-r border-slate-400">KEHADIRAN</th>
                                     <th className="p-2 border-r border-slate-400 text-center w-20">MARKAH (%)</th>
                                     <th className="p-2 text-center w-24 no-print">TINDAKAN</th>
                                  </tr>
                               </thead>
                               <tbody>
                                  {consolidatedCalon.map((c, idx) => (
                                     <tr key={idx} className="border-b border-slate-300 text-center font-semibold hover:bg-slate-50">
                                        <td className="p-2 border-r border-slate-300 font-bold">{idx + 1}</td>
                                        <td className="p-2 border-r border-slate-300 text-left font-bold uppercase">{safeStr(c.nama_penuh)}</td>
                                        <td className="p-2 border-r border-slate-300 font-bold">{c.jantina}</td>
                                        <td className="p-2 border-r border-slate-300 font-mono">{c.no_kp}</td>
                                        <td className="p-2 border-r border-slate-300 uppercase">{safeStr(c.sme_subjek) || '-'}</td>
                                        <td className="p-2 border-r border-slate-300 uppercase">{c.ppdClean}</td>
                                        <td className="p-2 border-r border-slate-300 uppercase font-bold text-amber-800">{safeStr(c.sesi)}</td>
                                        <td className="p-2 border-r border-slate-300 font-bold">
                                           <span className={c.kehadiran === 'HADIR' ? 'text-emerald-700' : 'text-slate-500'}>{c.kehadiran || 'BELUM'}</span>
                                        </td>
                                        <td className="p-2 border-r border-slate-300 text-center font-extrabold text-blue-900">{c.totalMarkah}%</td>
                                        <td className="p-2 text-center no-print space-x-1">
                                           <button onClick={() => handleEditCalonClick(c)} className="text-[10px] font-bold text-blue-600 hover:underline">Edit</button>
                                           <span className="text-slate-300">|</span>
                                           <button onClick={() => handleDeleteCalonClick(c.no_kp)} className="text-[10px] font-bold text-red-600 hover:underline">Padam</button>
                                        </td>
                                     </tr>
                                  ))}
                                  {consolidatedCalon.length === 0 && (
                                     <tr><td colSpan="10" className="p-6 text-center italic text-slate-500">Tiada calon dijumpai bagi kriteria pilihan ini.</td></tr>
                                  )}
                               </tbody>
                            </table>
                         </div>
                      </div>
                   )}

                   {/* TAB 2: PANEL PENEMUDUGA ZON */}
                   {activeTab === 'panel' && (
                      <div className="space-y-6">
                         <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex justify-between items-center no-print">
                            <div>
                               <h3 className="text-base font-extrabold text-amber-400 uppercase">Senarai Pegawai Panel Penemuduga Zon {selectedZon}</h3>
                               <p className="text-xs text-slate-400 mt-0.5">Jumlah Panel Bertugas: <b className="text-white">{panelZonList().length} Orang</b></p>
                            </div>
                            <button onClick={() => window.print()} className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold px-4 py-2.5 rounded-lg text-xs shadow transition-transform active:scale-95">🖨️ Cetak Senarai Panel A4</button>
                         </div>

                         <div className="bg-white p-8 border rounded-xl print-area text-slate-900 shadow-xl overflow-x-auto">
                            <div className="text-center mb-6">
                               <img src="logo-kpm.png" alt="Logo KPM" className="h-16 mx-auto mb-2 object-contain" />
                               <h3 className="text-xs font-bold uppercase tracking-wider">Kementerian Pendidikan Malaysia</h3>
                               <h4 className="text-[11px] font-semibold text-slate-600 uppercase">Bahagian Profesionalisme Guru</h4>
                               <h2 className="text-base font-black uppercase mt-2 text-slate-900 border-b-2 border-slate-900 pb-1 inline-block">
                                  SENARAI PEGAWAI PANEL PENEMUDUGA (ZON {selectedZon})
                               </h2>
                            </div>

                            <table className="w-full text-xs border-collapse border border-slate-400">
                               <thead>
                                  <tr className="bg-slate-200 border-b border-slate-400 text-left font-bold">
                                     <th className="p-2 border-r border-slate-400 w-10 text-center">#</th>
                                     <th className="p-2 border-r border-slate-400">NAMA PEGAWAI PANEL</th>
                                     <th className="p-2 border-r border-slate-400">NO. KAD PENGENALAN</th>
                                     <th className="p-2 border-r border-slate-400">JAWATAN</th>
                                     <th className="p-2 border-r border-slate-400">TEMPAT BERTUGAS</th>
                                     <th className="p-2 text-center w-36">PERANAN</th>
                                  </tr>
                               </thead>
                               <tbody className="font-semibold">
                                  {panelZonList().map((p, idx) => (
                                     <tr key={idx} className="border-b border-slate-300 hover:bg-slate-50">
                                        <td className="p-2 text-center border-r border-slate-300 font-bold">{p.bil}</td>
                                        <td className="p-2 border-r border-slate-300 font-bold uppercase">{p.nama}</td>
                                        <td className="p-2 border-r border-slate-300 font-mono">{p.no_kp}</td>
                                        <td className="p-2 border-r border-slate-300 uppercase">{p.jawatan}</td>
                                        <td className="p-2 border-r border-slate-300 uppercase">{p.tempat_bertugas}</td>
                                        <td className="p-2 text-center text-blue-900 font-extrabold uppercase">{p.peranan}</td>
                                     </tr>
                                  ))}
                                  {panelZonList().length === 0 && (
                                     <tr><td colSpan="6" className="p-6 text-center italic text-slate-500">Tiada rekod penugasan panel dijumpai bagi zon ini.</td></tr>
                                  )}
                               </tbody>
                            </table>
                         </div>
                      </div>
                   )}

                   {/* TAB 3: LAPORAN KEPUTUSAN RASMI ZON */}
                   {activeTab === 'keputusan' && (
                      <div className="space-y-6">
                         <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 flex flex-col md:flex-row justify-between items-center gap-4 no-print">
                            <div>
                               <h3 className="text-base font-extrabold text-blue-400 uppercase">Laporan Keputusan Rasmi Zon {selectedZon}</h3>
                               <p className="text-xs text-slate-400 mt-0.5">Penapisan kelulusan mengikut penanda aras peratusan minimum.</p>
                            </div>

                            <div className="flex items-center gap-3">
                               <div className="relative w-28">
                                  <input type="number" min="0" max="100" value={minScore} onChange={e => setMinScore(e.target.value)} className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-base font-bold text-emerald-400 text-center pr-6" />
                                  <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500">%</span>
                               </div>
                               <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-5 py-2.5 rounded-lg text-xs shadow transition-transform active:scale-95">🖨️ Cetak Laporan Keputusan A4</button>
                            </div>
                         </div>

                         <div className="bg-white p-8 border rounded-xl print-area text-slate-900 shadow-xl overflow-x-auto">
                            <div className="text-center mb-6">
                               <img src="logo-kpm.png" alt="Logo KPM" className="h-16 mx-auto mb-2 object-contain" />
                               <h3 className="text-xs font-bold uppercase tracking-wider">Kementerian Pendidikan Malaysia</h3>
                               <h4 className="text-[11px] font-semibold text-slate-600 uppercase">Bahagian Profesionalisme Guru</h4>
                               <h2 className="text-base font-black uppercase mt-2 text-slate-900 border-b-2 border-slate-900 pb-1 inline-block">
                                  SENARAI KEPUTUSAN MUKTAMAD CALON SELEKSI SISC+ (ZON {selectedZon})
                               </h2>
                               <p className="text-xs font-bold text-slate-700 mt-1">Tahap Kelulusan Minimum: {minScore}% dan ke atas</p>
                            </div>

                            <table className="w-full text-xs border-collapse border border-slate-400">
                               <thead>
                                  <tr className="bg-slate-200 border-b border-slate-400 text-center font-bold">
                                     <th className="p-2.5 border-r border-slate-400 w-10">#</th>
                                     <th className="p-2.5 border-r border-slate-400 text-left">NAMA CALON</th>
                                     <th className="p-2.5 border-r border-slate-400">JANTINA</th>
                                     <th className="p-2.5 border-r border-slate-400">NO. KP</th>
                                     <th className="p-2.5 border-r border-slate-400">SUBJEK (SME)</th>
                                     <th className="p-2.5 border-r border-slate-400">PPD</th>
                                     <th className="p-2.5 text-center w-24">MARKAH (%)</th>
                                  </tr>
                               </thead>
                               <tbody>
                                  {consolidatedCalon.filter(c => c.totalMarkah >= minScore).map((c, idx) => (
                                     <tr key={idx} className="border-b border-slate-300 text-center font-semibold hover:bg-slate-50">
                                        <td className="p-2 border-r border-slate-300 font-bold">{idx + 1}</td>
                                        <td className="p-2 border-r border-slate-300 text-left font-bold uppercase">{safeStr(c.nama_penuh)}</td>
                                        <td className="p-2 border-r border-slate-300 font-bold">{c.jantina}</td>
                                        <td className="p-2 border-r border-slate-300 font-mono">{c.no_kp}</td>
                                        <td className="p-2 border-r border-slate-300 uppercase">{safeStr(c.sme_subjek) || '-'}</td>
                                        <td className="p-2 border-r border-slate-300 uppercase">{c.ppdClean}</td>
                                        <td className="p-2 text-center font-extrabold text-base text-blue-900">{c.totalMarkah}%</td>
                                     </tr>
                                  ))}
                                  {consolidatedCalon.filter(c => c.totalMarkah >= minScore).length === 0 && (
                                     <tr><td colSpan="7" className="p-6 text-center italic text-slate-500">Tiada calon di Zon {selectedZon} yang melepasi had markah {minScore}%.</td></tr>
                                  )}
                               </tbody>
                            </table>

                            {/* RUANGAN PENGESAHAN URUS SETIA ZON */}
                            <div className="mt-12 flex justify-between items-end text-xs text-slate-800 pt-8 border-t border-slate-300">
                               <div>
                                  <p className="font-bold text-slate-500 uppercase text-[10px] mb-1">Disediakan Oleh:</p>
                                  <p className="font-bold uppercase text-sm">{currentUrusSetia?.nama_penuh || 'PEGAWAI URUS SETIA ZON'}</p>
                                  <p className="uppercase text-[11px] text-slate-600">URUS SETIA SELEKSI PEGAWAI SISC+ (ZON {selectedZon})</p>
                               </div>
                               <div className="text-right">
                                  <p className="font-bold text-slate-500 uppercase text-[10px] mb-1">Disahkan Oleh:</p>
                                  <p className="font-bold uppercase text-sm">BAHAGIAN PROFESIONALISME GURU</p>
                                  <p className="uppercase text-[11px] text-slate-600">KEMENTERIAN PENDIDIKAN MALAYSIA</p>
                                  <p className="mt-1 text-[10px] font-semibold text-slate-500">Tarikh: {new Date().toLocaleDateString('en-GB')}</p>
                               </div>
                            </div>

                         </div>
                      </div>
                   )}

                </div>
              )}

            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<UrusSetiaApp />);
    </script>
  </body>
</html>
