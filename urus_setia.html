<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul Urus Setia - Sistem SISC+</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; color: black !important; font-family: 'Arial', sans-serif; }
        .print-area { border: none !important; box-shadow: none !important; padding: 0 !important; width: 100% !important; }
        @page { size: A4 landscape; margin: 10mm; }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const SUPABASE_URL = 'https://beyxrxnuuwegkvziglmg.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_Ei-t0rPawbj3j8EpOOdAvQ_lwPz-oKO';
      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      function RadarChart({ dataScores }) {
        const canvasRef = useRef(null);
        const chartInstanceRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
          chartInstanceRef.current = new Chart(ctx, {
            type: 'radar',
            data: { labels: ['BIMBINGAN', 'INSTRUKSIONAL', 'STRATEGIK', 'ANALISIS', 'INTERPERSONAL', 'EVIDENS'], datasets: [{ label: 'MARKAH', data: [ dataScores.skor_bimbingan||0, dataScores.skor_instruksional||0, dataScores.skor_pemikiran_strategik||0, dataScores.skor_analisis_data||0, dataScores.skor_interpersonal||0, dataScores.skor_evidens||0 ], backgroundColor: 'rgba(212, 175, 55, 0.3)', borderColor: '#D4AF37', borderWidth: 3, pointBackgroundColor: '#F59E0B' }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { r: { angleLines: { color: '#475569' }, grid: { color: '#334155' }, pointLabels: { font: { size: 9, weight: 'bold' }, color: '#D4AF37' }, suggestedMin: 0, suggestedMax: 25 } }, plugins: { legend: { display: false } } }
          });
          return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
        }, [dataScores]);
        return <div className="w-full h-64 relative flex items-center justify-center"><canvas ref={canvasRef}></canvas></div>;
      }

      function UrusSetiaApp() {
        const [activeUser, setActiveUser] = useState(null);
        const [inputKP, setInputKP] = useState('');
        const [inputKatalaluan, setInputKatalaluan] = useState('');
        const [loginMsg, setLoginMsg] = useState({ type: '', text: '' });

        const [activeTab, setActiveTab] = useState('urus_calon');
        const [calonList, setCalonList] = useState([]);
        const [panelList, setPanelList] = useState([]);
        const [resultsList, setResultsList] = useState([]);

        const [filterZonCalon, setFilterZonCalon] = useState('SEMUA');
        const [filterSesiCalon, setFilterSesiCalon] = useState('SEMUA');
        const [editModeCalonKp, setEditModeCalonKp] = useState(null);
        const [editCalonForm, setEditCalonForm] = useState({});
        // Pindaan: Tambah tarikh pada calonForm
        const [calonForm, setCalonForm] = useState({ nama_penuh: '', no_kp: '', zon_temuduga: 'UTARA', sesi: 'SESI 1', tarikh: '', ppd: '', sme_subjek: '', bilik_temuduga: '', kehadiran: 'BELUM' });

        const [cetakZon, setCetakZon] = useState('');
        const [cetakSesi, setCetakSesi] = useState('');
        const [selectedCalon, setSelectedCalon] = useState(null);
        const [msg, setMsg] = useState({ type: '', text: '' });

        useEffect(() => { if (activeUser) fetchData(); }, [activeUser]);

        const fetchData = async () => {
          const { data: dataCalon } = await supabase.from('calon').select('*').order('created_at', { ascending: false });
          if (dataCalon) setCalonList(dataCalon);
          const { data: dataPanel } = await supabase.from('panel_penemuduga').select('*');
          if (dataPanel) setPanelList(dataPanel);
          const { data: dataSkor } = await supabase.from('penilaian_skor').select('*').order('created_at', { ascending: false });
          if (dataSkor) setResultsList(dataSkor);
        };

        const handleLogin = async (e) => {
          e.preventDefault();
          setLoginMsg({ type: '', text: '' });
          const { data, error } = await supabase.from('urus_setia').select('*').eq('no_kp', inputKP.trim()).eq('katalaluan', inputKatalaluan.trim()).single();
          if (error || !data) setLoginMsg({ type: 'error', text: 'Maklumat log masuk tidak tepat.' });
          else setActiveUser(data);
        };

        // Pindaan: Logik Gabungan Dropdown + Kalendar untuk Pendaftaran Calon
        const handleRegisterCalon = async (e) => {
          e.preventDefault();
          const formatTarikh = calonForm.tarikh.split('-').reverse().join('/');
          const sesiGabungan = `${calonForm.sesi} (${formatTarikh})`;

          const payload = {
            nama_penuh: calonForm.nama_penuh.toUpperCase(),
            no_kp: calonForm.no_kp,
            zon_temuduga: calonForm.zon_temuduga,
            sesi: sesiGabungan,
            ppd: calonForm.ppd.toUpperCase(),
            sme_subjek: calonForm.sme_subjek.toUpperCase(),
            bilik_temuduga: calonForm.bilik_temuduga,
            kehadiran: calonForm.kehadiran
          };

          const { error } = await supabase.from('calon').insert([payload]);
          if (error) setMsg({ type: 'error', text: 'Gagal mendaftar calon: ' + error.message });
          else { setMsg({ type: 'success', text: 'Calon berjaya didaftarkan!' }); setCalonForm({ nama_penuh: '', no_kp: '', zon_temuduga: 'UTARA', sesi: 'SESI 1', tarikh: '', ppd: '', sme_subjek: '', bilik_temuduga: '', kehadiran: 'BELUM' }); fetchData(); }
        };

        const handleUpdateCalon = async (kp_lama) => { await supabase.from('calon').update(editCalonForm).eq('no_kp', kp_lama); setEditModeCalonKp(null); fetchData(); };
        const handleDeleteCalon = async (kp, nama) => { if (!window.confirm(`AWAS! Anda pasti memadam calon ini secara kekal?\nNama: ${nama}`)) return; await supabase.from('calon').delete().eq('no_kp', kp); fetchData(); };
        const handleKehadiranToggle = async (kp, statusSemasa) => { let newStatus = 'HADIR'; if (statusSemasa === 'HADIR') newStatus = 'TIDAK HADIR'; else if (statusSemasa === 'TIDAK HADIR') newStatus = 'BELUM'; await supabase.from('calon').update({ kehadiran: newStatus }).eq('no_kp', kp); fetchData(); };

        const getResultForCandidate = (no_kp) => resultsList.find(r => String(r.no_kp_calon).trim() === String(no_kp).trim());
        const currentRes = selectedCalon ? getResultForCandidate(selectedCalon.no_kp) : null;
        const scoresMap = currentRes ? { skor_bimbingan: ((currentRes.skor_bimbingan || 0) / 5) * 25, skor_instruksional: ((currentRes.skor_instruksional || 0) / 5) * 20, skor_pemikiran_strategik: ((currentRes.skor_pemikiran_strategik || 0) / 5) * 20, skor_analisis_data: ((currentRes.skor_analisis_data || 0) / 5) * 15, skor_interpersonal: ((currentRes.skor_interpersonal || 0) / 5) * 10, skor_evidens: ((currentRes.skor_evidens || 0) / 5) * 10 } : { skor_bimbingan: 0, skor_instruksional: 0, skor_pemikiran_strategik: 0, skor_analisis_data: 0, skor_interpersonal: 0, skor_evidens: 0 };
        const totalMarkah = currentRes ? currentRes.jumlah_markah : 0;
        const panelPenilai = currentRes ? panelList.find(p => p.nama_penuh === currentRes.nama_panel) : null;

        const availableZonCalonList = [...new Set(calonList.map(c => c.zon_temuduga).filter(Boolean))].sort();
        const availableSesiCalonList = [...new Set(calonList.filter(c => filterZonCalon === 'SEMUA' || c.zon_temuduga === filterZonCalon).map(c => c.sesi).filter(Boolean))].sort();
        const displayedCalons = calonList.filter(c => { const matchZon = filterZonCalon === 'SEMUA' || c.zon_temuduga === filterZonCalon; const matchSesi = filterSesiCalon === 'SEMUA' || String(c.sesi) === String(filterSesiCalon); return matchZon && matchSesi; });
        const cetakSesiList = cetakZon ? [...new Set(calonList.filter(c => c.zon_temuduga === cetakZon).map(c => c.sesi).filter(Boolean))].sort() : [];
        const cetakCalonFiltered = cetakSesi ? calonList.filter(c => c.zon_temuduga === cetakZon && String(c.sesi) === String(cetakSesi)) : [];

        const TabButton = ({ id, label }) => ( <button onClick={() => { setActiveTab(id); setMsg({type:'',text:''}); }} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === id ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}`}> {label} </button> );

        return (
          <div className="min-h-screen flex flex-col">
            <div className="w-full flex flex-col no-print">
              <div className="bg-white w-full py-4 px-6 md:px-10 flex flex-col md:flex-row justify-between items-center shadow-md z-10 gap-4">
                <div className="flex items-center gap-4"><img src="logo-kpm.png" alt="Logo KPM" className="h-12 object-contain" /><span className="font-extrabold text-xl text-slate-900 tracking-wider border-l-2 border-slate-300 pl-4 hidden md:block">MODUL URUS SETIA SISC+</span></div>
                <div className="flex gap-3">
                  {activeUser && ( <><TabButton id="urus_calon" label="Urus Calon" /><TabButton id="cetak" label="Cetak Rumusan" /><button onClick={() => { setActiveUser(null); setInputKP(''); setInputKatalaluan(''); setSelectedCalon(null); setMsg({type:'',text:''}); }} className="px-4 py-2 rounded-lg text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200 transition-colors ml-2">Log Keluar</button></> )}
                  <a href="index.html" className="px-4 py-2 rounded-lg text-sm font-bold bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200 transition-colors ml-2">Kembali Utama</a>
                </div>
              </div>
              <div className="h-1.5 w-full bg-gradient-to-r from-amber-700 via-amber-300 to-amber-700 shadow-[0_2px_10px_rgba(212,175,55,0.4)]"></div>
            </div>

            <div className="p-6 max-w-7xl mx-auto w-full flex-grow mt-4">
              {!activeUser ? (
                <div className="bg-slate-900 border border-slate-800 p-10 rounded-2xl max-w-lg mx-auto my-12 shadow-2xl no-print">
                  <div className="text-center mb-8"><h2 className="text-3xl font-extrabold text-amber-400">Log Masuk Urus Setia</h2><p className="text-slate-400 text-base mt-2">Masukkan ID dan Kata Laluan anda.</p></div>
                  {loginMsg.text && (<div className="p-4 mb-6 rounded text-sm font-bold bg-red-900/80 text-red-200 border border-red-500 text-center">{loginMsg.text}</div>)}
                  <form onSubmit={handleLogin} className="space-y-6">
                    <input type="text" required placeholder="ID / No. Kad Pengenalan" className="w-full p-4 border border-slate-700 rounded-xl bg-slate-950 text-slate-100 text-lg font-mono font-bold text-center" value={inputKP} onChange={(e) => setInputKP(e.target.value)} />
                    <input type="password" required placeholder="Kata Laluan" className="w-full p-4 border border-slate-700 rounded-xl bg-slate-950 text-slate-100 text-lg font-mono font-bold text-center" value={inputKatalaluan} onChange={(e) => setInputKatalaluan(e.target.value)} />
                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-4 rounded-xl text-lg shadow-lg">Sahkan & Masuk</button>
                  </form>
                </div>
              ) : (
                <div>
                  {msg.text && ( <div className={`p-4 mb-6 rounded-lg text-base font-bold no-print ${msg.type === 'error' ? 'bg-red-900/80 text-red-200 border-red-500' : 'bg-emerald-900/80 text-emerald-200 border-emerald-500'}`}>{msg.text}</div> )}

                  {/* TAB URUS CALON (DIKEMAS KINI) */}
                  {activeTab === 'urus_calon' && (
                    <div className="no-print space-y-8">
                      <div className="bg-slate-900 border border-emerald-500/30 p-6 rounded-xl shadow">
                        <h2 className="text-xl font-bold text-emerald-400 mb-4 border-b border-slate-800 pb-2">+ Tambah Calon Baharu Secara Manual</h2>
                        <form onSubmit={handleRegisterCalon} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                          <input type="text" required placeholder="Nama Penuh Calon" className="p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100 col-span-2" value={calonForm.nama_penuh} onChange={e => setCalonForm({...calonForm, nama_penuh: e.target.value.toUpperCase()})} />
                          <input type="text" required placeholder="No. Kad Pengenalan" className="p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100" value={calonForm.no_kp} onChange={e => setCalonForm({...calonForm, no_kp: e.target.value})} />
                          <select required className="p-3 bg-slate-950 border border-slate-700 rounded text-sm font-bold text-amber-400" value={calonForm.zon_temuduga} onChange={e => setCalonForm({...calonForm, zon_temuduga: e.target.value})}>
                            <option value="UTARA">ZON UTARA</option><option value="TIMUR">ZON TIMUR</option><option value="TENGAH">ZON TENGAH</option><option value="SELATAN">ZON SELATAN</option><option value="SABAH">ZON SABAH</option><option value="SARAWAK">ZON SARAWAK</option>
                          </select>
                          
                          {/* PINDAAN DROPDOWN DAN KALENDAR UNTUK CALON */}
                          <select required className="p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100 font-bold" value={calonForm.sesi} onChange={e => setCalonForm({...calonForm, sesi: e.target.value})}>
                            <option value="SESI 1">SESI 1</option><option value="SESI 2">SESI 2</option><option value="SESI 3">SESI 3</option><option value="SESI 4">SESI 4</option><option value="SESI 5">SESI 5</option><option value="SESI KHAS">SESI KHAS</option>
                          </select>
                          <input type="date" required className="p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100" value={calonForm.tarikh} onChange={e => setCalonForm({...calonForm, tarikh: e.target.value})} />
                          
                          <input type="text" placeholder="PPD / Tempat Bertugas" className="p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100" value={calonForm.ppd} onChange={e => setCalonForm({...calonForm, ppd: e.target.value.toUpperCase()})} />
                          <input type="text" placeholder="SME Subjek (Cth: BM, SC)" className="p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100" value={calonForm.sme_subjek} onChange={e => setCalonForm({...calonForm, sme_subjek: e.target.value.toUpperCase()})} />
                          <button type="submit" className="md:col-span-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold rounded p-3 text-sm shadow">DAFTAR CALON</button>
                        </form>
                      </div>

                      <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-slate-800 pb-4">
                          <h2 className="text-lg font-bold text-amber-400">Senarai Calon Peserta & Kehadiran</h2>
                          <div className="flex gap-4">
                            <select className="p-2 border border-slate-700 rounded bg-slate-950 text-slate-100 text-sm font-bold" value={filterZonCalon} onChange={(e) => {setFilterZonCalon(e.target.value); setFilterSesiCalon('SEMUA');}}><option value="SEMUA">Semua Zon</option>{availableZonCalonList.map(z => <option key={z} value={z}>{z}</option>)}</select>
                            <select className="p-2 border border-slate-700 rounded bg-slate-950 text-slate-100 text-sm font-bold" value={filterSesiCalon} onChange={(e) => setFilterSesiCalon(e.target.value)}><option value="SEMUA">Semua Sesi</option>{availableSesiCalonList.map(s => <option key={s} value={s}>{s}</option>)}</select>
                          </div>
                        </div>
                        <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                          <table className="w-full text-left text-sm border-collapse relative">
                            <thead className="sticky top-0 bg-slate-950 shadow"><tr className="text-amber-400 uppercase text-xs border-b border-slate-800"><th className="p-3">Nama Calon</th><th className="p-3">No. KP</th><th className="p-3">Zon & Sesi</th><th className="p-3">PPD</th><th className="p-3 text-center">Kehadiran</th><th className="p-3 text-center">Tindakan</th></tr></thead>
                            <tbody>
                              {displayedCalons.map(c => editModeCalonKp === c.no_kp ? (
                                <tr key={c.no_kp} className="bg-slate-800">
                                  <td className="p-2"><input type="text" className="w-full p-2 bg-slate-900 rounded text-xs text-white border border-slate-600" value={editCalonForm.nama_penuh} onChange={e => setEditCalonForm({...editCalonForm, nama_penuh: e.target.value})} /></td>
                                  <td className="p-2"><input type="text" className="w-full p-2 bg-slate-900 rounded text-xs text-white border border-slate-600" disabled value={editCalonForm.no_kp} /></td>
                                  <td className="p-2 flex gap-1"><select className="w-1/2 p-2 bg-slate-900 rounded text-xs text-white" value={editCalonForm.zon_temuduga} onChange={e => setEditCalonForm({...editCalonForm, zon_temuduga: e.target.value})}><option value="UTARA">UTARA</option><option value="TIMUR">TIMUR</option><option value="TENGAH">TENGAH</option><option value="SELATAN">SELATAN</option><option value="SABAH">SABAH</option><option value="SARAWAK">SARAWAK</option></select><input type="text" className="w-1/2 p-2 bg-slate-900 rounded text-xs text-white" value={editCalonForm.sesi} onChange={e => setEditCalonForm({...editCalonForm, sesi: e.target.value})} /></td>
                                  <td className="p-2"><input type="text" className="w-full p-2 bg-slate-900 rounded text-xs text-white border border-slate-600" value={editCalonForm.ppd} onChange={e => setEditCalonForm({...editCalonForm, ppd: e.target.value})} /></td>
                                  <td className="p-2 text-center text-xs text-slate-400">Mod Edit</td>
                                  <td className="p-2 flex gap-1 justify-center"><button onClick={() => handleUpdateCalon(c.no_kp)} className="bg-emerald-500 text-slate-900 px-2 py-1 rounded font-bold text-xs">Simpan</button><button onClick={() => setEditModeCalonKp(null)} className="bg-slate-600 text-white px-2 py-1 rounded font-bold text-xs">Batal</button></td>
                                </tr>
                              ) : (
                                <tr key={c.no_kp} className="border-b border-slate-800 hover:bg-slate-800/50">
                                  <td className="p-3 font-bold">{c.nama_penuh}</td><td className="p-3 font-mono text-slate-300">{c.no_kp}</td><td className="p-3 text-amber-300 font-bold">{c.zon_temuduga} <span className="text-slate-400 font-normal">/ {c.sesi}</span></td><td className="p-3">{c.ppd}</td>
                                  <td className="p-3 text-center"><button onClick={() => handleKehadiranToggle(c.no_kp, c.kehadiran)} className={`px-3 py-1 rounded text-xs font-bold w-24 transition-colors border ${c.kehadiran === 'HADIR' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : c.kehadiran === 'TIDAK HADIR' ? 'bg-red-500/20 text-red-400 border-red-500/50' : 'bg-slate-700/50 text-slate-300 border-slate-600'}`}>{c.kehadiran || 'BELUM'}</button></td>
                                  <td className="p-3 text-center"><button onClick={() => { setEditModeCalonKp(c.no_kp); setEditCalonForm({...c}); }} className="text-blue-400 font-bold text-xs mx-1 hover:underline">Edit</button> | <button onClick={() => handleDeleteCalon(c.no_kp, c.nama_penuh)} className="text-red-400 font-bold text-xs mx-1 hover:underline">Padam</button></td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB CETAK RUMUSAN */}
                  {activeTab === 'cetak' && (
                    <div><div className="bg-slate-900 border-2 border-amber-500/50 p-6 rounded-xl shadow-2xl mb-8 flex justify-between items-center no-print"><div><h1 className="text-2xl font-extrabold text-amber-400">Cetakan Rumusan Skor</h1><p className="text-slate-300 text-sm">Pilih Zon dan Sesi untuk mencari calon.</p></div><button onClick={() => window.print()} disabled={!currentRes} className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold px-6 py-3 rounded-lg shadow-lg disabled:opacity-40">🖨️ Cetak Borang</button></div><div className="bg-slate-900 border border-slate-800 p-8 rounded-xl mb-8 shadow-sm no-print"><div className="grid grid-cols-1 md:grid-cols-3 gap-6"><div><label className="block text-sm font-bold uppercase text-amber-400 mb-2">1. Pilih Zon</label><select className="w-full p-4 border border-slate-700 rounded-lg text-base bg-slate-950 text-slate-100" value={cetakZon} onChange={(e) => {setCetakZon(e.target.value); setCetakSesi(''); setSelectedCalon(null);}}><option value="">-- Pilih Zon --</option>{availableZonCalonList.map(z => <option key={z} value={z}>{z}</option>)}</select></div><div><label className="block text-sm font-bold uppercase text-amber-400 mb-2">2. Pilih Sesi</label><select className="w-full p-4 border border-slate-700 rounded-lg text-base bg-slate-950 text-slate-100 disabled:opacity-50" value={cetakSesi} disabled={!cetakZon} onChange={(e) => {setCetakSesi(e.target.value); setSelectedCalon(null);}}><option value="">-- Pilih Sesi --</option>{cetakSesiList.map(s => <option key={s} value={s}>{s}</option>)}</select></div><div><label className="block text-sm font-bold uppercase text-amber-400 mb-2">3. Pilih Nama Calon</label><select className="w-full p-4 border border-slate-700 rounded-lg text-base bg-slate-950 text-slate-100 disabled:opacity-50" value={selectedCalon?.no_kp || ''} disabled={!cetakSesi} onChange={(e) => setSelectedCalon(calonList.find(c => c.no_kp === e.target.value) || null)}><option value="">-- Pilih Calon --</option>{cetakCalonFiltered.map(c => <option key={c.no_kp} value={c.no_kp}>{c.nama_penuh}</option>)}</select></div></div></div>
                      {selectedCalon && currentRes ? (<div className="bg-white p-8 border rounded-xl print-area text-slate-900"><div className="text-center mb-6"><img src="logo-kpm.png" alt="Logo KPM" className="h-20 mx-auto mb-2 object-contain" /><h3 className="text-sm font-bold uppercase tracking-wider">Kementerian Pendidikan</h3><h4 className="text-xs font-semibold text-slate-600 uppercase">Bahagian Profesionalisme Guru</h4><h2 className="text-base font-extrabold uppercase mt-2 tracking-wide border-b-2 border-slate-900 pb-1 inline-block">BORANG RUMUSAN SKOR INDIVIDU TEMU DUGA SISC+</h2></div><table className="w-full text-sm border-collapse border border-slate-400 mb-6 font-semibold"><tbody><tr className="border-b border-slate-400"><td className="p-2.5 bg-slate-100 border-r border-slate-400 w-1/4">NAMA CALON</td><td className="p-2.5 uppercase font-bold">{selectedCalon.nama_penuh}</td></tr><tr className="border-b border-slate-400"><td className="p-2.5 bg-slate-100 border-r border-slate-400">NO KAD PENGENALAN</td><td className="p-2.5 font-mono font-bold">{selectedCalon.no_kp}</td></tr><tr className="border-b border-slate-400"><td className="p-2.5 bg-slate-100 border-r border-slate-400">PPD & SUBJEK</td><td className="p-2.5 uppercase">{selectedCalon.ppd || '-'} ({selectedCalon.sme_subjek || '-'})</td></tr></tbody></table><div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6"><div><table className="w-full text-sm border-collapse border border-slate-400"><thead><tr className="bg-slate-100 border-b border-slate-400 font-bold text-center"><th className="p-2 border-r border-slate-400 text-left">KOMPETENSI</th><th className="p-2 border-r border-slate-400">MARKAH</th></tr></thead><tbody className="font-semibold text-center"><tr className="border-b border-slate-400 bg-amber-50"><td className="p-2 border-r border-slate-400 text-left">BIMBINGAN (25%)</td><td className="p-2">{scoresMap.skor_bimbingan.toFixed(1)}</td></tr><tr className="border-b border-slate-400 bg-amber-50"><td className="p-2 border-r border-slate-400 text-left">INSTRUKSIONAL (20%)</td><td className="p-2">{scoresMap.skor_instruksional.toFixed(1)}</td></tr><tr className="border-b border-slate-400 bg-amber-50"><td className="p-2 border-r border-slate-400 text-left">STRATEGIK (20%)</td><td className="p-2">{scoresMap.skor_pemikiran_strategik.toFixed(1)}</td></tr><tr className="border-b border-slate-400 bg-amber-50"><td className="p-2 border-r border-slate-400 text-left">ANALISIS DATA (15%)</td><td className="p-2">{scoresMap.skor_analisis_data.toFixed(1)}</td></tr><tr className="border-b border-slate-400 bg-amber-50"><td className="p-2 border-r border-slate-400 text-left">INTERPERSONAL (10%)</td><td className="p-2">{scoresMap.skor_interpersonal.toFixed(1)}</td></tr><tr className="border-b border-slate-400 bg-amber-50"><td className="p-2 border-r border-slate-400 text-left">EVIDENS (10%)</td><td className="p-2">{scoresMap.skor_evidens.toFixed(1)}</td></tr><tr className="bg-slate-200 font-extrabold"><td className="p-2 border-r border-slate-400 text-left">JUMLAH MARKAH</td><td className="p-2 text-base text-blue-900">{totalMarkah}%</td></tr></tbody></table><div className="mt-4 border border-slate-400 p-3 rounded min-h-[80px] text-sm"><p className="font-bold underline mb-1">Ulasan:</p><p className="italic text-slate-800 text-justify">{currentRes?.ulasan_panel || '-'}</p></div></div><div className="border border-slate-400 p-4 rounded flex flex-col items-center justify-center bg-slate-900 text-amber-400"><h4 className="text-xs font-bold text-center mb-2 uppercase">MARKAH vs KOMPETENSI</h4><RadarChart dataScores={scoresMap} /></div></div><div className="mt-12 flex justify-between items-end text-sm text-slate-800"><div><p className="font-bold text-slate-500 uppercase text-xs mb-1">Disediakan Oleh:</p><p className="font-bold uppercase text-base">{activeUser.nama_penuh}</p><p className="uppercase text-xs text-slate-500 mt-0.5">URUS SETIA TEMU DUGA</p></div><div className="text-right"><p className="font-bold text-slate-500 uppercase text-xs mb-1">Dinilai & Disahkan Oleh:</p><p className="font-bold uppercase text-base">{currentRes?.nama_panel || '-'}</p><p className="uppercase text-xs text-slate-500 mt-0.5">{panelPenilai ? panelPenilai.jawatan : '-'}</p><p className="mt-1 text-xs font-semibold">Tarikh: {currentRes?.created_at ? new Date(currentRes.created_at).toLocaleDateString('en-GB') : '-'}</p></div></div><div className="mt-8 text-xs text-slate-400 italic border-t pt-3 text-center">* Dokumen ini dijana secara automatik oleh Sistem Pengurusan Temuduga SISC+ dan tidak memerlukan tandatangan fizikal.</div></div>) : selectedCalon && !currentRes ? (<div className="p-10 text-center bg-slate-900 border border-slate-800 rounded-xl text-amber-400 font-bold">⚠️ Calon belum dinilai. Borang tidak dapat dijana.</div>) : null}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<UrusSetiaApp />);
    </script>
  </body>
</html>
