      function RadarChartKeseluruhan({ results }) {
        const canvasRef = useRef(null);
        const chartInstanceRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
          let avgScores = [0,0,0,0,0,0];
          if(results && results.length > 0) {
            let sums = [0,0,0,0,0,0];
            results.forEach(r => {
              sums[0] += ((r.skor_bimbingan||0)/5)*25; sums[1] += ((r.skor_instruksional||0)/5)*20;
              sums[2] += ((r.skor_pemikiran_strategik||0)/5)*20; sums[3] += ((r.skor_analisis_data||0)/5)*15;
              sums[4] += ((r.skor_interpersonal||0)/5)*10; sums[5] += ((r.skor_evidens||0)/5)*10;
            });
            avgScores = sums.map(s => s / results.length);
          }
          chartInstanceRef.current = new Chart(ctx, {
            type: 'radar',
            data: { labels: ['BIMBINGAN', 'INSTRUKSIONAL', 'STRATEGIK', 'ANALISIS', 'INTERPERSONAL', 'EVIDENS'], datasets: [{ label: 'Purata Keseluruhan', data: avgScores, backgroundColor: 'rgba(212, 175, 55, 0.2)', borderColor: '#D4AF37', borderWidth: 2, pointBackgroundColor: '#F59E0B' }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { r: { angleLines: { color: '#334155' }, grid: { color: '#1e293b' }, pointLabels: { font: { size: 10, weight: 'bold' }, color: '#94a3b8' }, suggestedMin: 0, suggestedMax: 25 } }, plugins: { legend: { display: false } } }
          });
          return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
        }, [results]);
        return <div className="w-full h-64"><canvas ref={canvasRef}></canvas></div>;
      }

      function DoughnutChartLulus({ results }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartRef.current) chartRef.current.destroy();
          const lulus = results ? results.filter(r => r.status_lulus).length : 0;
          const gagal = results ? results.length - lulus : 0;
          chartRef.current = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Layak', 'Belum Layak'], datasets: [{ data: results.length === 0 ? [1] : [lulus, gagal], backgroundColor: results.length === 0 ? ['#334155'] : ['#10B981', '#BE123C'], borderWidth: 0, hoverOffset: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } } }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [results]);
        return (
           <div className="w-full h-64 relative flex items-center justify-center">
              <div className="absolute flex flex-col items-center justify-center pointer-events-none">
                 <span className="text-3xl font-extrabold text-white">{results.length > 0 ? Math.round((results.filter(r=>r.status_lulus).length/results.length)*100) : 0}%</span>
                 <span className="text-xs text-slate-400 uppercase tracking-widest">Kadar Lulus</span>
              </div>
              <canvas ref={canvasRef}></canvas>
           </div>
        );
      }

      function StackedBarZon({ calonList, resultsList }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartRef.current) chartRef.current.destroy();
          const zons = [...new Set(calonList.map(c => safeStr(c.zon_temuduga)))].filter(Boolean).sort();
          const selesaiData = zons.map(z => { 
             const calonZon = calonList.filter(c => safeStr(c.zon_temuduga) === z); 
             return calonZon.filter(c => resultsList.some(r => r.no_kp_calon === c.no_kp)).length; 
          });
          const belumData = zons.map((z, idx) => { 
             const totalZon = calonList.filter(c => safeStr(c.zon_temuduga) === z).length; 
             return totalZon - selesaiData[idx]; 
          });
          chartRef.current = new Chart(ctx, {
            type: 'bar',
            data: { labels: zons, datasets: [ { label: 'Selesai Dinilai', data: selesaiData, backgroundColor: '#D4AF37' }, { label: 'Belum Dinilai', data: belumData, backgroundColor: '#334155' } ] },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true, grid: { display: false }, ticks:{color:'#94a3b8'} }, y: { stacked: true, grid: { color: '#1e293b' }, ticks:{color:'#94a3b8'} } }, plugins: { legend: { position: 'top', labels: { color: '#cbd5e1' } } } }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [calonList, resultsList]);
        return <div className="w-full h-64"><canvas ref={canvasRef}></canvas></div>;
      }
