    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ==========================================
      // KOMPONEN CARTA ANALITIK (CHART.JS)
      // ==========================================
      function RadarChartKeseluruhan({ results }) {
        const canvasRef = useRef(null);
        const chartInstanceRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
          let avgScores = [0,0,0,0,0,0];
          if(results.length > 0) {
            let sums = [0,0,0,0,0,0];
            results.forEach(r => {
              sums[0] += ((r.skor_bimbingan||0)/5)*25; sums[1] += ((r.skor_instruksional||0)/5)*20;
              sums[2] += ((r.skor_pemikiran_strategik||0)/5)*20; sums[3] += ((r.skor_analisis_data||0)/5)*15;
              sums[4] += ((r.skor_interpersonal||0)/5)*10; sums[5] += ((r.skor_evidens||0)/5)*10;
            });
            avgScores = sums.map(s => s / results.length);
          }
          chartInstanceRef.current = new Chart(ctx, {
            type: 'radar',
            data: { 
              labels: ['BIMBINGAN', 'INSTRUKSIONAL', 'STRATEGIK', 'ANALISIS', 'INTERPERSONAL', 'EVIDENS'], 
              datasets: [{ label: 'Purata Keseluruhan', data: avgScores, backgroundColor: 'rgba(212, 175, 55, 0.2)', borderColor: '#D4AF37', borderWidth: 2, pointBackgroundColor: '#F59E0B' }] 
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { r: { angleLines: { color: '#334155' }, grid: { color: '#1e293b' }, pointLabels: { font: { size: 10, weight: 'bold' }, color: '#94a3b8' }, suggestedMin: 0, suggestedMax: 25 } }, plugins: { legend: { display: false } } }
          });
          return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
        }, [results]);
        return <div className="w-full h-64"><canvas ref={canvasRef}></canvas></div>;
      }

      function DoughnutChartLulus({ results }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartRef.current) chartRef.current.destroy();
          const lulus = results.filter(r => r.status_lulus).length;
          const gagal = results.length - lulus;
          chartRef.current = new Chart(ctx, {
            type: 'doughnut',
            data: { 
              labels: ['Layak (>=75%)', 'Belum Layak'], 
              datasets: [{ data: results.length === 0 ? [1] : [lulus, gagal], backgroundColor: results.length === 0 ? ['#334155'] : ['#10B981', '#BE123C'], borderWidth: 0, hoverOffset: 4 }] 
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } } }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [results]);
        return (
           <div className="w-full h-64 relative flex items-center justify-center">
              <div className="absolute flex flex-col items-center justify-center pointer-events-none">
                 <span className="text-3xl font-extrabold text-white">{results.length > 0 ? Math.round((results.filter(r=>r.status_lulus).length/results.length)*100) : 0}%</span>
                 <span className="text-xs text-slate-400 uppercase tracking-widest">Kadar Lulus</span>
              </div>
              <canvas ref={canvasRef}></canvas>
           </div>
        );
      }

      function StackedBarZon({ calonList, resultsList }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartRef.current) chartRef.current.destroy();
          const zons = [...new Set(calonList.map(c => c.zon_temuduga))].sort();
          const selesaiData = zons.map(z => { 
             const calonZon = calonList.filter(c => c.zon_temuduga === z); 
             return calonZon.filter(c => resultsList.some(r => r.no_kp_calon === c.no_kp)).length; 
          });
          const belumData = zons.map((z, idx) => { 
             const totalZon = calonList.filter(c => c.zon_temuduga === z).length; 
             return totalZon - selesaiData[idx]; 
          });
          chartRef.current = new Chart(ctx, {
            type: 'bar',
            data: { 
              labels: zons, 
              datasets: [ 
                { label: 'Selesai Dinilai', data: selesaiData, backgroundColor: '#D4AF37' }, 
                { label: 'Belum Dinilai', data: belumData, backgroundColor: '#334155' } 
              ] 
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true, grid: { display: false }, ticks:{color:'#94a3b8'} }, y: { stacked: true, grid: { color: '#1e293b' }, ticks:{color:'#94a3b8'} } }, plugins: { legend: { position: 'top', labels: { color: '#cbd5e1' } } } }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [calonList, resultsList]);
        return <div className="w-full h-64"><canvas ref={canvasRef}></canvas></div>;
      }

xt-base">PENTADBIR SISTEM (ADMIN)</p><p className="uppercase text-xs text-slate-500 mt-0.5">BAHAGIAN PROFESIONALISME GURU</p></div><div className="text-right"><p className="font-bold text-slate-500 uppercase text-xs mb-1">Dinilai & Disahkan Oleh:</p><p className="font-bold uppercase text-base">{currentRes?.nama_panel || '-'}</p><p className="uppercase text-xs text-slate-500 mt-0.5">{panelPenilai ? panelPenilai.jawatan : '-'}</p><p className="mt-1 text-xs font-semibold">Tarikh: {currentRes?.created_at ? new Date(currentRes.created_at).toLocaleDateString('en-GB') : '-'}</p></div></div><div className="mt-8 text-xs text-slate-400 italic border-t pt-3 text-center">* Dokumen ini dijana secara automatik oleh Sistem Pengurusan Temuduga SISC+ dan tidak memerlukan tandatangan fizikal.</div></div>)}</div>)}
              {activeTab === 'tetapan' && (<div className="bg-slate-900 border border-slate-800 p-8 rounded-xl max-w-2xl mx-auto shadow-2xl"><h2 className="text-xl font-bold text-amber-400 mb-6 border-b border-slate-800 pb-3">Tetapan Semula Katalaluan Admin Utama</h2><form onSubmit={handleResetPassword} className="space-y-6"><input type="email" required placeholder="Emel Rasmi (Cth: admin@moe.gov.my)" className="w-full p-4 border border-slate-700 rounded-lg bg-slate-950 text-slate-100" value={adminEmail} onChange={(e) => setAdminEmail(e.target.value)} /><button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-xl text-lg">Hantar Pautan Ke Emel</button></form></div>)}
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
    </script>
  </body>
