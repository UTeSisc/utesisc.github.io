      const SUPABASE_URL = 'https://beyxrxnuuwegkvziglmg.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_Ei-t0rPawbj3j8EpOOdAvQ_lwPz-oKO';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const safeStr = (val) => (val ? String(val).trim() : '');
      const cleanKpNum = (val) => safeStr(val).replace(/[^0-9]/g, '');

      const getParentZon = (str) => {
        if (!str) return '';
        return safeStr(str).split('(')[0].trim().toUpperCase();
      };

      const getPusatFromZonString = (str) => {
        if (!str || !str.includes('(')) return '';
        return safeStr(str).split('(')[1].replace(')', '').trim().toUpperCase();
      };

      const mapNegeriFromData = (calon) => {
        const strPpd = safeStr(calon.ppd).toUpperCase();
        const strZon = getParentZon(calon.zon_temuduga);

        if (strPpd.includes('KUCHING') || strPpd.includes('MIRI') || strPpd.includes('SIBU') || strPpd.includes('BINTULU') || strPpd.includes('SUBIS') || strPpd.includes('SAMARAHAN') || strPpd.includes('PADAWAN') || strPpd.includes('BETONG') || strPpd.includes('SARATOK') || strPpd.includes('SRI AMAN') || strPpd.includes('LIMBANG') || strPpd.includes('LAWAS') || strZon === 'SARAWAK') return 'SARAWAK';
        if (strPpd.includes('KOTA KINABALU') || strPpd.includes('SANDAKAN') || strPpd.includes('TAWAU') || strPpd.includes('KENINGAU') || strPpd.includes('LAHAD DATU') || strPpd.includes('PENAMPANG') || strPpd.includes('KUDAT') || strZon === 'SABAH') return 'SABAH';
        if (strPpd.includes('LABUAN')) return 'W.P. LABUAN';
        if (strPpd.includes('KINTA') || strPpd.includes('KANGSAR') || strPpd.includes('LARUT') || strPpd.includes('KERIAN') || strPpd.includes('HILIR PERAK') || strPpd.includes('MUALLIM')) return 'PERAK';
        if (strPpd.includes('KOTA SETAR') || strPpd.includes('KULIM') || strPpd.includes('KUALA MUDA') || strPpd.includes('BALING') || strPpd.includes('KUBANG PASU') || strPpd.includes('PENDANG')) return 'KEDAH';
        if (strPpd.includes('SEBERANG PERAI') || strPpd.includes('TIMUR LAUT') || strPpd.includes('BARAT DAYA')) return 'PULAU PINANG';
        if (strPpd.includes('PERLIS') || strZon === 'PERLIS') return 'PERLIS';
        if (strPpd.includes('JOHOR') || strPpd.includes('BATU PAHAT') || strPpd.includes('MUAR') || strPpd.includes('KLUANG') || strZon === 'SELATAN') return 'JOHOR';
        if (strPpd.includes('MELAKA')) return 'MELAKA';
        if (strPpd.includes('SEREMBAN') || strPpd.includes('PORT DICKSON') || strPpd.includes('JEMPOL')) return 'NEGERI SEMBILAN';
        if (strPpd.includes('KUALA LUMPUR') || strPpd.includes('BANGSAR') || strPpd.includes('SENTUL') || strPpd.includes('KERAMAT')) return 'W.P. KUALA LUMPUR';
        if (strPpd.includes('SELANGOR') || strPpd.includes('PETALING') || strPpd.includes('KLANG') || strPpd.includes('HULU LANGAT') || strZon === 'TENGAH') return 'SELANGOR';
        if (strPpd.includes('PAHANG') || strPpd.includes('KUANTAN') || strPpd.includes('TEMERLOH')) return 'PAHANG';
        if (strPpd.includes('TERENGGANU') || strPpd.includes('KUALA TERENGGANU')) return 'TERENGGANU';
        if (strPpd.includes('KELANTAN') || strPpd.includes('KOTA BHARU')) return 'KELANTAN';
        
        return strZon || 'LAIN-LAIN';
      };

      const cleanSesiName = (sStr) => {
         if (!sStr) return '';
         return safeStr(sStr).split('(')[0].trim().toUpperCase();
      };

      const consolidateCalonResults = (calonList, resultsList) => {
        return calonList.map(calon => {
          const calonRes = resultsList.filter(r => safeStr(r.no_kp_calon) === safeStr(calon.no_kp));
          if (calonRes.length === 0) return null;

          let sums = { bimb:0, inst:0, strat:0, data:0, inter:0, evi:0 };
          let counts = { bimb:0, inst:0, strat:0, data:0, inter:0, evi:0 };
          let panelNames = [];
          let ulasanList = [];

          calonRes.forEach(r => {
            if (r.nama_panel && !panelNames.includes(r.nama_panel)) panelNames.push(r.nama_panel);
            if (r.ulasan_panel && r.ulasan_panel.trim() !== '') ulasanList.push(`${r.nama_panel}: ${r.ulasan_panel}`);

            if (Number(r.skor_bimbingan) > 0) { sums.bimb += Number(r.skor_bimbingan); counts.bimb++; }
            if (Number(r.skor_instruksional) > 0) { sums.inst += Number(r.skor_instruksional); counts.inst++; }
            if (Number(r.skor_pemikiran_strategik) > 0) { sums.strat += Number(r.skor_pemikiran_strategik); counts.strat++; }
            if (Number(r.skor_analisis_data) > 0) { sums.data += Number(r.skor_analisis_data); counts.data++; }
            if (Number(r.skor_interpersonal) > 0) { sums.inter += Number(r.skor_interpersonal); counts.inter++; }
            if (Number(r.skor_evidens) > 0) { sums.evi += Number(r.skor_evidens); counts.evi++; }
          });

          const avgBimb = counts.bimb > 0 ? (sums.bimb / counts.bimb) : 0;
          const avgInst = counts.inst > 0 ? (sums.inst / counts.inst) : 0;
          const avgStrat = counts.strat > 0 ? (sums.strat / counts.strat) : 0;
          const avgData = counts.data > 0 ? (sums.data / counts.data) : 0;
          const avgInter = counts.inter > 0 ? (sums.inter / counts.inter) : 0;
          const avgEvi = counts.evi > 0 ? (sums.evi / counts.evi) : 0;

          const m1 = (avgBimb / 5) * 25;
          const m2 = (avgInst / 5) * 20;
          const m3 = (avgStrat / 5) * 20;
          const m4 = (avgData / 5) * 15;
          const m5 = (avgInter / 5) * 10;
          const m6 = (avgEvi / 5) * 10;

          const totalMuktamad = Number((m1 + m2 + m3 + m4 + m5 + m6).toFixed(1));
          const indukZon = getParentZon(calon.zon_temuduga);
          const pus = safeStr(calon.pusat_temuduga) || getPusatFromZonString(calon.zon_temuduga) || '-';

          return {
            no_kp_calon: calon.no_kp,
            nama_calon: safeStr(calon.nama_penuh).toUpperCase(),
            zon: indukZon,
            raw_zon: safeStr(calon.zon_temuduga).toUpperCase(),
            negeri: mapNegeriFromData(calon),
            pusat: pus.toUpperCase(),
            ppd: safeStr(calon.ppd).toUpperCase(),
            sme_subjek: safeStr(calon.sme_subjek).toUpperCase() || 'SME',
            sesi: safeStr(calon.sesi).toUpperCase(),
            skor_bimbingan: avgBimb,
            skor_instruksional: avgInst,
            skor_pemikiran_strategik: avgStrat,
            skor_analisis_data: avgData,
            skor_interpersonal: avgInter,
            skor_evidens: avgEvi,
            jumlah_markah: totalMuktamad,
            status_lulus: totalMuktamad >= 75,
            panel_list: panelNames.join(", "),
            ulasan_panel: ulasanList.join("\n---\n")
          };
        }).filter(Boolean);
      };

      function RadarChartKeseluruhan({ results }) {
        const canvasRef = useRef(null);
        const chartInstanceRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();

          let avgScores = [0,0,0,0,0,0];
          if(results && results.length > 0) {
            let sums = [0,0,0,0,0,0];
            results.forEach(r => {
              sums[0] += Number(r.skor_bimbingan || 0);
              sums[1] += Number(r.skor_instruksional || 0);
              sums[2] += Number(r.skor_pemikiran_strategik || 0);
              sums[3] += Number(r.skor_analisis_data || 0);
              sums[4] += Number(r.skor_interpersonal || 0);
              sums[5] += Number(r.skor_evidens || 0);
            });
            avgScores = sums.map(s => s / results.length);
          }

          chartInstanceRef.current = new Chart(ctx, {
            type: 'radar',
            data: { 
              labels: [
                'BIMBINGAN (25%)', 
                'INSTRUKSIONAL (20%)', 
                'STRATEGIK (20%)', 
                'ANALISIS DATA (15%)', 
                'INTERPERSONAL (10%)', 
                'EVIDENS (10%)'
              ], 
              datasets: [{ 
                label: 'Purata Skor Penguasaan (Skala 5)', 
                data: avgScores, 
                backgroundColor: 'rgba(212, 175, 55, 0.25)', 
                borderColor: '#D4AF37', 
                borderWidth: 2.5, 
                pointBackgroundColor: '#F59E0B' 
              }] 
            },
            options: { 
              responsive: true, 
              maintainAspectRatio: false, 
              scales: { 
                r: { 
                  angleLines: { color: '#334155' }, 
                  grid: { color: '#1e293b' }, 
                  ticks: { display: false },
                  pointLabels: { font: { size: 10, weight: 'bold' }, color: '#cbd5e1' }, 
                  suggestedMin: 0, 
                  suggestedMax: 5 
                } 
              }, 
              plugins: { legend: { display: false } } 
            }
          });
          return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
        }, [results]);

        return <div className="w-full h-64"><canvas ref={canvasRef}></canvas></div>;
      }

      function DoughnutChartLulus({ results }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartRef.current) chartRef.current.destroy();
          const lulus = results ? results.filter(r => r.status_lulus).length : 0;
          const gagal = results ? results.length - lulus : 0;
          chartRef.current = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Layak', 'Belum Layak'], datasets: [{ data: results.length === 0 ? [1] : [lulus, gagal], backgroundColor: results.length === 0 ? ['#334155'] : ['#10B981', '#BE123C'], borderWidth: 0, hoverOffset: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } } }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [results]);
        return (
           <div className="w-full h-64 relative flex items-center justify-center">
              <div className="absolute flex flex-col items-center justify-center pointer-events-none">
                 <span className="text-3xl font-extrabold text-white">{results.length > 0 ? Math.round((results.filter(r=>r.status_lulus).length/results.length)*100) : 0}%</span>
                 <span className="text-xs text-slate-400 uppercase tracking-widest">Kadar Lulus</span>
              </div>
              <canvas ref={canvasRef}></canvas>
           </div>
        );
      }

      function StackedBarZon({ calonList, resultsList }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          const ctx = canvasRef.current.getContext('2d');
          if (chartRef.current) chartRef.current.destroy();

          const zons = [...new Set(calonList.map(c => getParentZon(c.zon_temuduga)))].filter(Boolean).sort();

          const selesaiData = zons.map(z => { 
             const calonZon = calonList.filter(c => getParentZon(c.zon_temuduga) === z); 
             return calonZon.filter(c => resultsList.some(r => safeStr(r.no_kp_calon) === safeStr(c.no_kp))).length; 
          });
          const belumData = zons.map((z, idx) => { 
             const totalZon = calonList.filter(c => getParentZon(c.zon_temuduga) === z).length; 
             return totalZon - selesaiData[idx]; 
          });

          chartRef.current = new Chart(ctx, {
            type: 'bar',
            data: { labels: zons, datasets: [ { label: 'Selesai Dinilai', data: selesaiData, backgroundColor: '#D4AF37' }, { label: 'Belum Dinilai', data: belumData, backgroundColor: '#334155' } ] },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true, grid: { display: false }, ticks:{color:'#94a3b8'} }, y: { stacked: true, grid: { color: '#1e293b' }, ticks:{color:'#94a3b8'} } }, plugins: { legend: { position: 'top', labels: { color: '#cbd5e1' } } } }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [calonList, resultsList]);
        return <div className="w-full h-64"><canvas ref={canvasRef}></canvas></div>;
      }

        const handleProcessBulkUpload = async () => {
           if (!bulkText.trim()) return alert("Tiada data untuk dimuat naik. Sila sedut data atau tampal teks dahulu.");
           setBulkLoading(true);

           try {
              const lines = bulkText.split(/\r?\n/).filter(line => line.trim().length > 0);
              const candidatesToInsert = [];

              for (let i = 0; i < lines.length; i++) {
                 const line = lines[i];
                 let cols = line.includes('\t') ? line.split('\t') : line.split(',');
                 cols = cols.map(c => safeStr(c).replace(/^["']|["']$/g, ''));

                 const firstColUpper = safeStr(cols[0]).toUpperCase();
                 if (firstColUpper === 'NAMA' || firstColUpper === 'BIL' || firstColUpper === 'NAMA CALON' || firstColUpper === 'NO' || firstColUpper === 'ZON') continue;

                 let noKp = '';
                 let nama = '';
                 let ppd = '';
                 let subjek = '';
                 let sesi = 'SESI 1';
                 let bilik = bulkBilikDefault || 'BILIK 1';
                 let zon = safeStr(bulkZonTarget).toUpperCase();
                 let pusat = null;

                 let kpIndex = cols.findIndex(c => cleanKpNum(c).length >= 10 && cleanKpNum(c).length <= 14);

                 if (kpIndex !== -1) {
                    noKp = cleanKpNum(cols[kpIndex]);

                    const colBefore = kpIndex > 0 ? safeStr(cols[kpIndex - 1]) : '';
                    const colAfter = (kpIndex + 1 < cols.length) ? safeStr(cols[kpIndex + 1]) : '';

                    const isZoneOrNumber = (val) => {
                       const v = val.toUpperCase();
                       return !val || !isNaN(val) || v === 'SARAWAK' || v === 'SABAH' || v.includes('ZON') || v.includes('SESI');
                    };

                    if (isZoneOrNumber(colBefore)) {
                       nama = colAfter;
                    } else {
                       nama = colBefore;
                    }

                    const isGradeOrMeta = (val) => {
                       const v = val.toUpperCase();
                       return v.startsWith('DG') || v.startsWith('GRED') || v.startsWith('PPP') || v.includes('MEMANGKU') || v.startsWith('HAKIKI') || v.startsWith('SESI');
                    };

                    for (let cIdx = kpIndex + 2; cIdx < cols.length; cIdx++) {
                       const cellVal = safeStr(cols[cIdx]);
                       if (!cellVal) continue;
                       const uVal = cellVal.toUpperCase();

                       if (uVal.startsWith('SMK') || uVal.startsWith('SK') || uVal.startsWith('SJK') || uVal.startsWith('PPD') || uVal.startsWith('KOLEJ') || uVal.includes('SEKOLAH')) {
                          ppd = cellVal;
                          break;
                       }

                       if (!ppd && !isGradeOrMeta(cellVal) && !uVal.includes('SESI') && !uVal.includes('BILIK')) {
                          ppd = cellVal;
                       }
                    }

                    if (!ppd || isGradeOrMeta(ppd)) {
                       const uLine = line.toUpperCase();
                       const districtList = ['KUCHING', 'PADAWAN', 'SAMARAHAN', 'BAU', 'LUNDU', 'SERIAN', 'SRI AMAN', 'BETONG', 'SARATOK', 'MIRI', 'BINTULU', 'SUBIS', 'BARAM', 'LIMBANG', 'LAWAS', 'SIBU', 'MUKAH', 'KAPIT'];
                       const foundDist = districtList.find(d => uLine.includes(d));
                       ppd = foundDist ? `PPD ${foundDist}` : 'SARAWAK';
                    }

                 } else {
                    nama = cols[1] && isNaN(cols[1]) ? cols[1] : cols[0];
                    noKp = cleanKpNum(cols[0]) || cleanKpNum(cols[1]);
                    ppd = cols[2] || 'SARAWAK';
                    subjek = cols[3] || 'SME';
                 }

                 if (!noKp || !nama || nama.toUpperCase() === 'SARAWAK') continue;

                 if (bulkDefaultSesi !== 'AUTO') {
                    sesi = bulkDefaultSesi;
                 } else {
                    const findSesi = cols.find(c => safeStr(c).toUpperCase().includes('SESI'));
                    if (findSesi) sesi = safeStr(findSesi).toUpperCase();
                 }

                 const findBilik = cols.find(c => safeStr(c).toUpperCase().includes('BILIK'));
                 if (findBilik) bilik = safeStr(findBilik).toUpperCase();

                 if (hasSubCenters) {
                    if (bulkPusatTarget === 'AUTO') {
                       const uAll = `${line} ${ppd}`.toUpperCase();
                       if (uAll.includes('MIRI') || uAll.includes('BINTULU') || uAll.includes('SUBIS') || uAll.includes('BARAM') || uAll.includes('LIMBANG') || uAll.includes('LAWAS')) {
                          pusat = 'MIRI';
                       } else {
                          pusat = 'KUCHING';
                       }
                    } else {
                       pusat = safeStr(bulkPusatTarget).toUpperCase();
                    }
                 } else {
                    pusat = null;
                 }

                 candidatesToInsert.push({
                    nama_penuh: nama.toUpperCase(),
                    no_kp: noKp,
                    ppd: ppd.toUpperCase(),
                    sme_subjek: subjek.toUpperCase() || 'SME',
                    zon_temuduga: getParentZon(zon),
                    pusat_temuduga: pusat ? pusat.toUpperCase() : null,
                    bilik_temuduga: bilik.toUpperCase(),
                    sesi: sesi.toUpperCase(),
                    kehadiran: 'BELUM'
                 });
              }

              if (candidatesToInsert.length === 0) {
                 alert("Tiada rekod calon sah dikesan. Sila semak pautan atau teks data.");
                 setBulkLoading(false);
                 return;
              }

              const { error } = await sb.from('calon').upsert(candidatesToInsert, { onConflict: 'no_kp' });

              if (error) {
                 alert("Gagal memuat naik: " + error.message);
              } else {
                 alert(`Berjaya! ${candidatesToInsert.length} orang calon dikemas kini ke dalam pangkalan data!`);
                 setShowBulkModal(false);
                 setBulkText('');
                 fetchData();
              }
           } catch (err) {
              alert("Ralat memproses: " + err.message);
           } finally {
              setBulkLoading(false);
           }
        };

                                <h2 className="text-xl font-bold text-blue-400 mb-6 border-b border-slate-800 pb-3">1. Daftar Profil Akaun Urus Setia</h2>
                                <form onSubmit={handleRegisterUS} className="space-y-4">
                                   <input type="text" required placeholder="Nama Penuh Urus Setia" className="w-full p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100 uppercase font-bold" value={usForm.nama_penuh} onChange={e => setUsForm({...usForm, nama_penuh: e.target.value.toUpperCase()})} />
                                   <input type="text" required placeholder="No. Kad Pengenalan / ID" className="w-full p-3 bg-slate-950 border border-slate-700 rounded text-sm font-mono text-slate-100" value={usForm.no_kp} onChange={e => setUsForm({...usForm, no_kp: e.target.value})} />
                                   <input type="text" required placeholder="Kata Laluan" className="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-sm font-mono text-slate-100" value={usForm.katalaluan} onChange={e => setUsForm({...usForm, katalaluan: e.target.value})} />
                                   <button type="submit" className="w-full mt-2 bg-blue-500 hover:bg-blue-600 text-white font-extrabold rounded-lg py-3 text-sm shadow-lg">Daftar Profil Urus Setia</button>
                                </form>
                             </div>

                             <div className="bg-slate-900 border border-indigo-500/30 p-6 rounded-xl shadow-md">
                                <h2 className="text-xl font-bold text-indigo-400 mb-6 border-b border-slate-800 pb-3">2. Agihan Penugasan Zon Urus Setia</h2>
                                <form onSubmit={handleRegisterPenugasanUS} className="space-y-4">
                                   <label className="block text-xs text-slate-400 font-bold uppercase">Pilih Urus Setia Berdaftar</label>
                                   <select required className="w-full p-3 border border-slate-700 rounded bg-slate-950 text-slate-100 text-sm font-bold uppercase" value={penugasanUsForm.no_kp_us} onChange={(e) => setPenugasanUsForm({...penugasanUsForm, no_kp_us: e.target.value})}>
                                      <option value="">-- Sila Pilih Urus Setia --</option>
                                      {urusSetiaList.map(u => <option key={u.no_kp} value={u.no_kp}>{safeStr(u.nama_penuh).toUpperCase()} ({u.no_kp})</option>)}
                                   </select>
                                   
                                   <div className="grid grid-cols-2 gap-4">
                                      <div>
                                         <label className="block text-xs text-slate-400 font-bold uppercase mb-1">Zon Bertugas</label>
                                         <input type="text" required list="list-zon-us" placeholder="ZON" className="w-full p-3 border border-slate-700 rounded bg-slate-950 text-amber-300 font-bold text-sm uppercase" value={penugasanUsForm.zon_bertugas} onChange={(e) => setPenugasanUsForm({...penugasanUsForm, zon_bertugas: e.target.value.toUpperCase()})} />
                                         <datalist id="list-zon-us">
                                            <option value="SARAWAK" />
                                            <option value="SABAH" />
                                            <option value="UTARA" />
                                            <option value="TIMUR" />
                                            <option value="TENGAH" />
                                            <option value="SELATAN" />
                                         </datalist>
                                      </div>

                                      {hasSubCenters ? (
                                         <div>
                                            <label className="block text-xs text-slate-400 font-bold uppercase mb-1">Pusat Bertugas</label>
                                            <select className="w-full p-3 border border-slate-700 rounded bg-slate-950 text-emerald-300 font-bold text-sm uppercase" value={penugasanUsForm.pusat_bertugas} onChange={(e) => setPenugasanUsForm({...penugasanUsForm, pusat_bertugas: e.target.value.toUpperCase()})}>
                                               {customCenterList.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                         </div>
                                      ) : (
                                         <div>
                                            <label className="block text-xs text-slate-500 font-bold uppercase mb-1">Pusat Bertugas</label>
                                            <input type="text" disabled value="KESELURUHAN ZON (TIADA PUSAT)" className="w-full p-3 border border-slate-800 rounded bg-slate-950/60 text-slate-500 text-xs italic" />
                                         </div>
                                      )}
                                   </div>

                                   <div className="grid grid-cols-2 gap-4">
                                      <div>
                                         <label className="block text-xs text-slate-400 font-bold uppercase mb-1">Tarikh Mula</label>
                                         <input type="date" required className="w-full p-3 border border-slate-700 rounded bg-slate-950 text-slate-100 text-sm" value={penugasanUsForm.tarikh_mula} onChange={(e) => setPenugasanUsForm({...penugasanUsForm, tarikh_mula: e.target.value})} />
                                      </div>
                                      <div>
                                         <label className="block text-xs text-slate-400 font-bold uppercase mb-1">Tarikh Tamat</label>
                                         <input type="date" required className="w-full p-3 border border-slate-700 rounded bg-slate-950 text-slate-100 text-sm" value={penugasanUsForm.tarikh_tamat} onChange={(e) => setPenugasanUsForm({...penugasanUsForm, tarikh_tamat: e.target.value})} />
                                      </div>
                                   </div>

                                   <button type="submit" className="w-full mt-2 bg-indigo-500 hover:bg-indigo-600 text-white font-extrabold rounded-lg py-3 text-sm shadow-lg">Tambah Penugasan Urus Setia</button>
                                </form>
                             </div>

                          </div>

                          <div className="bg-slate-900 border border-indigo-500/20 p-6 rounded-xl shadow-lg mt-8">
                             <h2 className="text-lg font-bold text-indigo-400 mb-4 border-b border-slate-800 pb-3">Ringkasan Agihan Penugasan Urus Setia Aktif</h2>
                             <div className="overflow-x-auto min-h-[150px]">
                                <table className="w-full text-left text-sm border-collapse relative">
                                   <thead className="bg-slate-950 shadow">
                                      <tr className="text-indigo-400 uppercase text-xs border-b border-slate-800">
                                         <th className="p-3">Nama Pegawai (Urus Setia)</th>
                                         <th className="p-3">Zon & Pusat</th>
                                         <th className="p-3">Tempoh Tarikh</th>
                                         <th className="p-3 text-center">Tindakan</th>
                                      </tr>
                                   </thead>
                                   <tbody>
                                      {penugasanUSList.length === 0 ? (
                                         <tr><td colSpan="4" className="text-center p-6 text-slate-500 italic">Tiada rekod penugasan urus setia dijumpai.</td></tr>
                                      ) : penugasanUSList.map(tugas => {
                                         const uDetail = urusSetiaList.find(u => u.no_kp === tugas.no_kp_us);
                                         return (
                                            <tr key={tugas.id} className="border-b border-slate-800 hover:bg-slate-800/50">
                                               <td className="p-3 font-bold uppercase">{uDetail ? safeStr(uDetail.nama_penuh).toUpperCase() : safeStr(tugas.no_kp_us)}</td>
                                               <td className="p-3 font-bold text-amber-300 uppercase">
                                                  {getParentZon(tugas.zon_bertugas)} <br/>
                                                  <span className="text-emerald-400 font-extrabold text-xs">{tugas.pusat_bertugas ? `PUSAT: ${safeStr(tugas.pusat_bertugas).toUpperCase()}` : (getPusatFromZonString(tugas.zon_bertugas) ? `PUSAT: ${getPusatFromZonString(tugas.zon_bertugas)}` : 'SEMUA PUSAT')}</span>
                                               </td>
                                               <td className="p-3 font-mono text-slate-300 text-xs">{safeStr(tugas.tempoh_bertugas)}</td>
                                               <td className="p-3 text-center">
                                                  <button onClick={() => handleDeletePenugasanUS(tugas.id)} className="text-red-400 font-bold text-xs hover:underline">Batal Tugas</button>
                                               </td>
                                            </tr>
                                         );
                                      })}
                                   </tbody>
                                </table>
                             </div>
                          </div>

                          <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg">
                             <h2 className="text-lg font-bold text-amber-400 mb-6 border-b border-slate-800 pb-4">Pangkalan Data Profil Urus Setia Berdaftar</h2>
                             <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm border-collapse">
                                   <thead>
                                      <tr className="bg-slate-950 text-amber-400 uppercase text-xs border-b border-slate-800">
                                         <th className="p-4">Nama Penuh</th><th className="p-4">ID / No. KP</th><th className="p-4">Kata Laluan</th><th className="p-4 text-center">Tindakan</th>
                                      </tr>
                                   </thead>
                                   <tbody>
                                      {urusSetiaList.map((u) => editModeUsKp === u.no_kp ? (
                                         <tr key={u.no_kp} className="bg-slate-800">
                                            <td className="p-2"><input type="text" className="w-full p-2 bg-slate-900 border border-slate-600 rounded text-sm text-white uppercase font-bold" value={editUsForm.nama_penuh} onChange={e => setEditUsForm({...editUsForm, nama_penuh: e.target.value.toUpperCase()})} /></td>
                                            <td className="p-2"><input type="text" className="w-full p-2 bg-slate-900 border border-slate-600 rounded text-sm text-slate-400" disabled value={editUsForm.no_kp} /></td>
                                            <td className="p-2"><input type="text" className="w-full p-2 bg-slate-900 border border-slate-600 rounded text-sm text-white" value={editUsForm.katalaluan} onChange={e => setEditUsForm({...editUsForm, katalaluan: e.target.value})} /></td>
                                            <td className="p-2 flex gap-1 justify-center"><button onClick={() => handleUpdateUS(u.no_kp)} className="bg-emerald-500 text-slate-900 px-3 py-1.5 rounded font-bold text-xs">Simpan</button><button onClick={() => setEditModeUsKp(null)} className="bg-slate-600 text-white px-3 py-1.5 rounded font-bold text-xs">Batal</button></td>
                                         </tr>
                                      ) : (
                                         <tr key={u.no_kp} className="border-b border-slate-800 hover:bg-slate-800/50">
                                            <td className="p-4 font-bold text-base uppercase">{safeStr(u.nama_penuh)}</td>
                                            <td className="p-4 font-mono text-amber-300 text-base">{safeStr(u.no_kp)}</td>
                                            <td className="p-4 font-mono text-slate-300 text-base">{u.katalaluan}</td>
                                            <td className="p-4 text-center"><button onClick={() => { setEditModeUsKp(u.no_kp); setEditUsForm({...u}); }} className="text-blue-400 font-bold text-sm mx-2 hover:underline">Edit</button> | <button onClick={() => handleDeleteUS(u.no_kp)} className="text-red-400 font-bold text-sm mx-2 hover:underline">Padam</button></td>
                                         </tr>
                                      ))}
                                   </tbody>
                                </table>
                             </div>
                          </div>
                       </div>
                    )}
                    
                    {activeTab === 'tetapan' && (
                       <div className="bg-slate-900 border border-slate-800 p-8 rounded-xl max-w-xl mx-auto shadow-2xl space-y-6">
                          <div>
                             <h2 className="text-xl font-bold text-amber-400 border-b border-slate-800 pb-2">Kemaskini Kata Laluan Admin</h2>
                             <p className="text-xs text-slate-400 mt-1">Sila masukkan kata laluan semasa dan kata laluan baharu anda.</p>
                          </div>

                          <form onSubmit={handleChangeAdminPassword} className="space-y-4">
                             <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Username Utama</label>
                                <input type="text" disabled className="w-full p-3 bg-slate-950/60 border border-slate-800 rounded text-sm text-slate-400 font-mono" value={currentAdmin?.username || 'admin_utama'} />
                             </div>
                             <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Kata Laluan Semasa</label>
                                <input type="password" required placeholder="••••••••" className="w-full p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100 focus:border-amber-500 focus:outline-none" value={passForm.currentPass} onChange={e => setPassForm({...passForm, currentPass: e.target.value})} />
                             </div>
                             <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Kata Laluan Baharu</label>
                                <input type="password" required placeholder="••••••••" className="w-full p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100 focus:border-amber-500 focus:outline-none" value={passForm.newPass} onChange={e => setPassForm({...passForm, newPass: e.target.value})} />
                             </div>
                             <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Sahkan Kata Laluan Baharu</label>
                                <input type="password" required placeholder="••••••••" className="w-full p-3 bg-slate-950 border border-slate-700 rounded text-sm text-slate-100 focus:border-amber-500 focus:outline-none" value={passForm.confirmPass} onChange={e => setPassForm({...passForm, confirmPass: e.target.value})} />
                             </div>
                             <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3.5 rounded-lg text-sm shadow-lg transition-transform active:scale-95 mt-2">
                                SIMPAN KATA LALUAN BAHARU
                             </button>
                          </form>
                       </div>
                    )}
                  </div>
               </>
            )}

            {showBulkModal && (
               <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border-2 border-amber-500/50 rounded-2xl p-6 max-w-2xl w-full shadow-2xl space-y-4">
                     <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                        <h3 className="text-base font-extrabold text-amber-400 uppercase">📋 Muat Naik Pukal Calon (Google Sheets / CSV)</h3>
                        <button onClick={() => setShowBulkModal(false)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                     </div>

                     <div className="p-3 bg-slate-950 rounded-xl border border-blue-500/30 space-y-2">
                        <label className="block text-blue-400 text-xs font-bold uppercase">
                           Pautan Google Sheets (Publish to Web as CSV)
                        </label>
                        <div className="flex gap-2">
                           <input 
                              type="text" 
                              placeholder="Tampal URL Google Sheet di sini..." 
                              className="flex-grow p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 focus:border-blue-500 focus:outline-none" 
                              value={bulkUrl} 
                              onChange={e => setBulkUrl(e.target.value)} 
                           />
                           <button 
                              type="button" 
                              onClick={handleFetchFromUrl} 
                              disabled={bulkLoading} 
                              className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow whitespace-nowrap"
                           >
                              {bulkLoading ? 'Menyedut...' : 'Sedut Data'}
                           </button>
                        </div>
                     </div>

                     <div className="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
                        <div>
                           <label className="block text-slate-400 font-bold uppercase mb-1">Zon Calon:</label>
                           <input 
                              type="text" 
                              list="list-zon-bulk" 
                              className="w-full p-2 bg-slate-950 border border-slate-700 rounded text-amber-300 font-bold uppercase" 
                              value={bulkZonTarget} 
                              onChange={e => setBulkZonTarget(e.target.value.toUpperCase())} 
                           />
                           <datalist id="list-zon-bulk">
                              <option value="SARAWAK" />
                              <option value="SABAH" />
                              <option value="UTARA" />
                              <option value="TIMUR" />
                              <option value="TENGAH" />
                              <option value="SELATAN" />
                           </datalist>
                        </div>

                        <div>
                           <label className="block text-slate-400 font-bold uppercase mb-1">Pusat Calon:</label>
                           <select className="w-full p-2 bg-slate-950 border border-slate-700 rounded text-emerald-300 font-bold uppercase" value={bulkPusatTarget} onChange={e => setBulkPusatTarget(e.target.value)}>
                              <option value="AUTO">✨ AUTO (KUCHING / MIRI)</option>
                              {customCenterList.map(c => <option key={c} value={c}>{c}</option>)}
                           </select>
                        </div>

                        <div>
                           <label className="block text-slate-400 font-bold uppercase mb-1">Tetapan Sesi:</label>
                           <select className="w-full p-2 bg-slate-950 border border-slate-700 rounded text-slate-200 font-bold" value={bulkDefaultSesi} onChange={e => setBulkDefaultSesi(e.target.value)}>
                              <option value="AUTO">✨ AUTO DARI LAJUR</option>
                              <option value="SESI 1">SESI 1</option>
                              <option value="SESI 2">SESI 2</option>
                              <option value="SESI 3">SESI 3</option>
                              <option value="SESI 4">SESI 4</option>
                              <option value="SESI 5">SESI 5</option>
                              <option value="SESI 6">SESI 6</option>
                           </select>
                        </div>

                        <div>
                           <label className="block text-slate-400 font-bold uppercase mb-1">Bilik Lalai:</label>
                           <input 
                              type="text" 
                              className="w-full p-2 bg-slate-950 border border-slate-700 rounded text-slate-100 font-bold uppercase text-xs" 
                              value={bulkBilikDefault} 
                              onChange={e => setBulkBilikDefault(e.target.value.toUpperCase())} 
                              placeholder="BILIK 1" 
                           />
                        </div>
                     </div>

                     <div>
                        <label className="block text-slate-300 text-xs font-bold uppercase mb-1">
                           Data Helaian yang Disedut / Tampalan:
                        </label>
                        <textarea 
                           rows="6" 
                           placeholder="Data akan muncul di sini secara automatik selepas menekan butang 'Sedut Data'..." 
                           className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-xs font-mono text-slate-200 focus:border-amber-500 focus:outline-none" 
                           value={bulkText} 
                           onChange={e => setBulkText(e.target.value)} 
                        />
                     </div>

                     <div className="flex justify-end gap-3 pt-2 border-t border-slate-800">
                        <button onClick={() => setShowBulkModal(false)} className="px-4 py-2 bg-slate-800 text-slate-300 font-bold rounded-lg text-xs">Batal</button>
                        <button onClick={handleProcessBulkUpload} disabled={bulkLoading} className="px-6 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs shadow-lg transition-transform active:scale-95">
                           {bulkLoading ? 'Sedang Memproses...' : '🚀 Sahkan & Masukkan Calon'}
                        </button>
                     </div>
                  </div>
               </div>
            )}

          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
    </script>
  </body>
</html>
